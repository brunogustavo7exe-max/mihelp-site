<style>
/* MESA: identidade fundo #0d0b0a, laranja #f89f2e / #ec7121, texto #fdf5eb. Base: protótipo do painel. */
:root{--bg:#0d0b0a;--sf:#17130f;--sf2:#211b16;--ln:#322920;--tx:#fdf5eb;--mu:#ab9c8a;--ac:#f89f2e;--ac2:#ec7121;--ok:#3ddc84;--wr:#ffd166;--er:#ff6b5e;--okb:#12301f;--wrb:#3a2f0e;--erb:#3d1814;--acb:rgba(248,159,46,.14);--grad:linear-gradient(135deg,#f89f2e,#ec7121);--on-ac:#1a0d02;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fbf6ef;--sf:#fff;--sf2:#f5ece1;--ln:#e6d8c6;--tx:#1d1611;--mu:#6e5f50;--ac:#c9650a;--ok:#0f8a4b;--wr:#9a6200;--er:#c62d20;--okb:#e1f4e9;--wrb:#fff0cf;--erb:#fde5e2;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:25px;margin:0 0 2px;letter-spacing:-.02em}h2{font-size:15px;margin:0 0 10px}p{margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.g{flex:1;min-width:0}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;padding:22px 14px;border-right:1px solid var(--ln);background:var(--sf)}
.brand{padding:0 12px 18px}.brand b{display:block;font-size:19px;letter-spacing:-.02em}
.nav{display:grid;gap:2px}
.nv{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:10px 12px;border:0;background:none;color:var(--tx);border-radius:8px;font:inherit;text-align:left;cursor:pointer}
.nv[aria-current=page]{background:var(--acb);color:var(--ac);font-weight:600}
.cnt{background:var(--ac);color:var(--bg);border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
.shop{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--ln)}
main{padding:26px 30px 48px;min-width:0}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--bg)}.btn.full{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nv:focus-visible,.sw:focus-visible,input:focus-visible,select:focus-visible,.lnk:focus-visible,.stp button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pill{font:inherit;font-weight:600;border:0;border-radius:99px;padding:9px 14px;cursor:pointer}.pill.ok{background:var(--okb);color:var(--ok)}.pill.er{background:var(--erb);color:var(--er)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--ln);border-radius:10px;background:var(--sf);margin-bottom:16px;overflow:hidden}
.stat{padding:12px 16px;border-right:1px solid var(--ln)}.stat:last-child{border:0}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.stat span{font-size:13px;color:var(--mu)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(268px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{background:var(--sf2);border-radius:12px;border-top:3px solid var(--c);padding:10px;min-height:240px;scroll-snap-align:start}
.col h2{display:flex;justify-content:space-between}.empty{padding:14px 4px}
.oc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;gap:7px}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center}.oc ul{margin:0;padding-left:18px}.note{font-size:13px;color:var(--wr)}
.age{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.age.wr{background:var(--wrb);color:var(--wr)}.age.er{background:var(--erb);color:var(--er)}
.tg{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--acb);color:var(--ac);margin-right:8px}
.acts2{display:grid;gap:6px;margin-top:2px}
@keyframes fr{from{box-shadow:0 0 0 3px var(--ac)}to{box-shadow:0 0 0 0 transparent}}.fresh{animation:fr 1.6s ease-out}
@media (prefers-reduced-motion:reduce){.fresh{animation:none}}
.add{margin-bottom:16px}.add summary{display:inline-block;list-style:none}.add summary::-webkit-details-marker{display:none}
.addf{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end;margin-top:12px;padding:14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
.mc{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--ln)}.mc h2+.row{border-top:0}
.row.off .g{opacity:.55}
.pr{display:flex;align-items:center;gap:6px;color:var(--mu)}.pr input{width:84px;text-align:right}
.av2{width:78px;text-align:right}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--mu);position:relative;cursor:pointer;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true] i{transform:translateX(18px)}
.f{display:grid;gap:4px;margin-bottom:10px;font-size:13px;color:var(--mu)}
input,select{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:0}
.callout{background:var(--okb);color:var(--ok);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-weight:600}
.lnk{font:inherit;font-weight:700;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.stage{display:flex;justify-content:center;padding:6px 0}
.phone{width:100%;max-width:390px;border:1px solid var(--ln);border-radius:28px;background:var(--sf);overflow:hidden;box-shadow:0 14px 44px rgba(0,0,0,.14)}
.ph-body{height:clamp(480px,calc(100vh - 230px),700px);overflow-y:auto;padding:20px 16px 0}
.ph-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}.nm{font-size:17px}
.avt{flex:none;width:54px;height:54px;border-radius:50%;background:#7a2a4d;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.stl{font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;margin-bottom:12px}.stl.ok{background:var(--okb);color:var(--ok)}.stl.er{background:var(--erb);color:var(--er)}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--ln);font-weight:600;font-size:14px;color:var(--mu)}.tab.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
.ph-body h3{font-size:15px;margin:16px 0 2px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}.it.off .g{opacity:.5}.pv{font-weight:700;margin-top:2px}
.sm-b{padding:8px 16px}
.stp{display:flex;align-items:center;gap:8px}.stp button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);font-size:18px;cursor:pointer}
.bar{position:sticky;bottom:0;margin:14px -16px 0;padding:12px 16px;background:var(--sf);border-top:1px solid var(--ln)}
.back{font:inherit;font-weight:600;background:none;border:0;color:var(--ac);cursor:pointer;padding:0 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}.seg button{font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);cursor:pointer}.seg .on{background:var(--acb);border-color:var(--ac);color:var(--ac)}
.tl{display:flex;justify-content:space-between;padding:4px 0}.tl.big{font-size:17px;border-top:1px solid var(--ln);margin-top:4px;padding-top:10px}
.err{color:var(--er);font-weight:600;font-size:14px}
.done{text-align:center;padding:60px 6px 0;display:grid;gap:12px;justify-items:center}.ck{width:60px;height:60px;border-radius:50%;background:var(--okb);color:var(--ok);display:grid;place-items:center;font-size:30px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:50;max-width:90vw}
@media (max-width:800px){
.app{display:block}.brand,.shop{display:none}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln);z-index:20}
.nav{display:flex;width:100%;gap:4px}.nv{flex:1;justify-content:center;padding:11px 6px;font-size:13px}
main{padding:18px 14px 96px}#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.row{flex-wrap:wrap}.row .g{flex-basis:100%}}

/* Identidade MESA */
body{background:radial-gradient(760px 360px at 90% -80px,rgba(248,159,46,.09),transparent 70%),var(--bg)}
.btn.pri,.cnt,.tab.on,.avt{background:var(--grad);border-color:transparent;color:var(--on-ac)}
.btn.pri{font-weight:700}.btn.pri:disabled{filter:grayscale(.6)}
.brand{padding:0 6px 20px}.brand img{display:block;width:100%;max-width:190px;height:auto}
.nv{transition:background .15s}.nv:hover{background:var(--sf2)}.nv[aria-current=page]{box-shadow:inset 3px 0 0 var(--ac)}
.oc{transition:border-color .15s}.oc:hover{border-color:var(--ac2)}
.tg.test{background:var(--wrb);color:var(--wr)}
.phone{box-shadow:0 14px 44px rgba(0,0,0,.5)}
.mbar{display:none}
@media (max-width:800px){.mbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--sf)}.mbar img{width:34px;height:auto;border-radius:6px}.mbar b{font-size:15px}}
.side,.mbar{background:var(--bg)}

/* Cardápio visual */
textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-width:0;resize:vertical}
textarea:focus-visible,.btn:focus-within,.pc-main:focus-visible,.pc-add:focus-visible,.cats button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{position:relative}.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.thumb{flex:none;width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--sf2)}.thumb-capa{width:96px}
.imgcampo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--ln)}
.imgcampo .g{min-width:130px}
.add-btn{margin-bottom:16px}
.capa{height:132px;margin:-20px -16px 0;background:linear-gradient(135deg,#3a2410,#1a110a 70%);overflow:hidden}.capa img{width:100%;height:100%;object-fit:cover;display:block}
.perfil{display:flex;gap:12px;align-items:flex-end;margin:-28px 0 10px;position:relative}.perfil .nm{margin:0;font-size:18px}.perfil .g{padding-bottom:2px}
.logo{flex:none;width:64px;height:64px;border-radius:16px;border:3px solid var(--sf);object-fit:cover;background:var(--sf)}.logo.avt{display:grid;font-size:28px}
.cats{position:sticky;top:0;z-index:3;display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
.cats button{flex:none;font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf2);color:var(--tx);cursor:pointer}
.cat{scroll-margin-top:52px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.pc{position:relative;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:var(--sf2)}
.pc-main{display:block;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pc-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.pc-t{display:grid;gap:3px;padding:10px 10px 12px}
.pc-d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pc-p{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
.disp{font-size:12px;font-weight:600}.disp.ok{color:var(--ok)}.disp.er{color:var(--er)}.pc.off .pc-img{filter:grayscale(1);opacity:.5}
.pc-add{position:absolute;top:8px;right:8px;min-width:34px;height:34px;padding:0 8px;border:0;border-radius:99px;background:var(--grad);color:var(--on-ac);font:inherit;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}.pc-add:disabled{filter:grayscale(.7);cursor:not-allowed}
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7)}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--sf);border-radius:18px 18px 0 0;border:1px solid var(--ln)}
.shot{width:100%;aspect-ratio:16/10;object-fit:cover}.sh-pad{padding:16px}.sheet h2{margin:0;font-size:19px}.sheet h3{font-size:15px;margin:16px 0 4px}
.op{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}.op input{width:20px;height:20px;accent-color:var(--ac)}
.fprev{aspect-ratio:4/3;max-width:300px;margin:12px 0;border-radius:12px;overflow:hidden}.fprev img,.fprev .vazio{width:100%;height:100%;object-fit:cover}
@media (min-width:801px){.ov{align-items:center}.sheet{border-radius:18px}.phone{max-width:560px}.capa{height:160px}}
@media (max-width:800px){.row .g{flex-basis:calc(100% - 78px)}}
.vazio{display:grid;place-items:center;background:linear-gradient(135deg,var(--sf2),var(--sf));border:1px solid var(--ln)}.vazio img{width:34%;max-width:56px;height:auto;opacity:.35}

/* Correção do cardápio da Prévia: o preenchimento de cima do celular deixava os cards aparecerem ACIMA das categorias fixas */
.ph-body{padding-top:0}
.ph-body>:first-child:not(.capa){margin-top:20px}
.capa{margin:0 -16px}
.cats{box-shadow:0 1px 0 var(--ln)}

/* Entrada (login) no estilo do DOMIN, com as cores do MESA */
#entrada{display:none}
body.deslogado .app{display:none}
body.deslogado #entrada{display:grid;min-height:100vh;place-items:center;padding:24px 14px}
.lg{width:100%;max-width:430px;display:grid;gap:10px;text-align:center;padding:22px 22px 18px;border:1px solid var(--ln);border-radius:22px;background:linear-gradient(180deg,var(--sf),var(--bg));box-shadow:0 18px 60px rgba(0,0,0,.55),0 0 0 1px rgba(248,159,46,.08)}
.lg .mesa{display:block;width:220px;max-width:70%;height:auto;margin:0 auto 2px;mix-blend-mode:lighten}
.lg .sub{color:var(--mu);margin-bottom:4px}
.lg .f{text-align:center}.lg input:not([type=checkbox]){text-align:center;background:var(--bg);padding:13px 10px;border-radius:12px}
.lg .ckl{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--mu);cursor:pointer}.lg .ckl input{width:18px;height:18px;accent-color:var(--ac)}
.lg .btn{width:100%;padding:13px;font-size:16px;border-radius:12px}
.lg .esq{font-size:13px;color:var(--mu)}.lg .esq a{color:var(--ac)}
.dcby{display:block;width:130px;max-width:50%;height:auto;margin:10px auto 0;opacity:.95}
.shop .dcby{margin:14px 0 0;width:120px}
.shop .lnk{display:block;margin-top:8px;font-size:13px;font-weight:600;color:var(--mu)}

/* Estabelecimento */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.hrow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}
.hck{display:flex;gap:8px;align-items:center;min-width:128px;cursor:pointer}.hck input{width:18px;height:18px;accent-color:var(--ac)}
.hts{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.hts input{padding:7px 8px}
.hrow.off .hts{display:none}.hfech{color:var(--mu);font-size:13px}
@media (max-width:800px){.nv{white-space:normal;line-height:1.15;padding:9px 2px;font-size:12px;text-align:center}}

/* digitar e escolher */
.cbx{position:fixed;z-index:9999;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-height:260px;overflow:auto;padding:4px}
.cbx button{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:transparent;border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
.cbx button:hover,.cbx button.on{background:var(--acb)}
.cbx p{margin:0;padding:10px 12px;color:var(--mu);font-size:13px}
.cbok{color:var(--ok);font-size:12px;margin-top:4px;display:block}
.loc{margin-top:6px}
</style>

<script>
/* Dinheiro sempre em CENTAVOS INTEIROS. Conversão de/para texto brasileiro só nas bordas. */
(function (M) {
  'use strict';
  const formatador = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const COM_VIRGULA = /^(\d+|\d{1,3}(\.\d{3})+),\d{1,2}$/;   // 1.234,56 | 12,5 | 1234,56
  const INTEIRO = /^(\d+|\d{1,3}(\.\d{3})+)$/;               // 15 | 1.500 (= mil e quinhentos)
  const PONTO_DECIMAL = /^\d+\.\d{1,2}$/;                    // 12.50

  M.Money = {
    formatar: (centavos) => formatador.format(centavos / 100),
    paraCampo: (centavos) => (centavos / 100).toFixed(2).replace('.', ','),
    /** Texto digitado -> centavos inteiros, ou NaN se inválido. */
    interpretar(texto) {
      const s = String(texto).replace(/R\$|\s/g, '');
      let reais;
      if (COM_VIRGULA.test(s)) reais = s.replace(/\./g, '').replace(',', '.');
      else if (INTEIRO.test(s)) reais = s.replace(/\./g, '');
      else if (PONTO_DECIMAL.test(s)) reais = s;
      else return NaN;
      const centavos = Math.round(Number(reais) * 100);
      return Number.isSafeInteger(centavos) && centavos >= 0 && centavos < 1e9 ? centavos : NaN;
    },
  };
})((window.MESA = window.MESA || {}));

/* Regras de pedido em um só lugar: etapas, transições, totais, atraso e indicadores. Sem DOM. */
(function (M) {
  'use strict';
  const ETAPAS = {
    novo:       { rotulo: 'Novos',      cor: '--ac', proxima: () => ({ para: 'preparando', acao: 'Aceitar e preparar' }) },
    preparando: { rotulo: 'Preparando', cor: '--wr', proxima: () => ({ para: 'pronto', acao: 'Marcar como pronto' }) },
    pronto:     { rotulo: 'Prontos',    cor: '--ok', proxima: (o) => o.tipo === 'entrega'
                  ? { para: 'a_caminho', acao: 'Saiu para entrega' } : { para: 'entregue', acao: 'Cliente retirou' } },
    a_caminho:  { rotulo: 'A caminho',  cor: '--mu', proxima: () => ({ para: 'entregue', acao: 'Entrega concluída' }) },
    entregue:   { rotulo: 'Entregues',  proxima: () => null },
    cancelado:  { rotulo: 'Cancelados', proxima: () => null },
  };
  const ATRASO_ALERTA_MIN = 15, ATRASO_CRITICO_MIN = 30;

  const subtotal = (o) => o.itens.reduce((soma, i) => soma + i.qtd * i.precoCentavos, 0);
  const total = (o) => subtotal(o) + o.taxaEntregaCentavos;
  const mesmoDia = (ts, ref) => new Date(ts).toDateString() === ref.toDateString();

  M.Pedidos = {
    ETAPAS,
    COLUNAS: ['novo', 'preparando', 'pronto', 'a_caminho'],
    subtotal, total,
    proximaEtapa: (o) => (ETAPAS[o.status] ? ETAPAS[o.status].proxima(o) : null),
    podeRecusar: (o) => o.status === 'novo',
    minutosDesde: (o, agora = Date.now()) => Math.max(0, Math.floor((agora - o.criadoEm) / 60000)),
    nivelAtraso: (min) => (min > ATRASO_CRITICO_MIN ? 'er' : min > ATRASO_ALERTA_MIN ? 'wr' : ''),
    /** Indicadores calculados só com pedidos reais salvos (sem valores de base). */
    indicadores(pedidos, agora = new Date()) {
      const validos = pedidos.filter((o) => o.status !== 'cancelado');
      const hoje = validos.filter((o) => mesmoDia(o.criadoEm, agora));
      return {
        hoje: hoje.length,
        emAndamento: validos.filter((o) => o.status !== 'entregue').length,
        concluidos: hoje.filter((o) => o.status === 'entregue').length,
        vendidoCentavos: hoje.reduce((soma, o) => soma + total(o), 0),
      };
    },
  };
})((window.MESA = window.MESA || {}));

    { id: 'p3', categoria: 'Lanches', nome: 'X-Frango crocante', descricao: 'Filé empanado, maionese verde e salada', precoCentavos: 2400, disponivel: true, fotoId: null, adicionais: [] },

    { id: 'p5', categoria: 'Porções', nome: 'Onion rings', descricao: 'Anéis de cebola empanados, 300 g', precoCentavos: 1800, disponivel: true, fotoId: null, adicionais: [] },
    { id: 'p6', categoria: 'Bebidas', nome: 'Coca-Cola lata', descricao: '350 ml', precoCentavos: 600, disponivel: true, fotoId: null, adicionais: [] },
    { id: 'p7', categoria: 'Bebidas', nome: 'Suco de maracujá', descricao: '500 ml, natural', precoCentavos: 900, disponivel: false, fotoId: null, adicionais: [] },
  ];
  const configPadrao = () => ({
    nome: 'Meu estabelecimento', descricao: '', informacoes: '', capaId: null, logoId: null, aberta: true, taxaEntregaCentavos: 500,

  const colecoes = {

  function criarAdaptadorLocal() {
    let storage = null;
    try { storage = window.localStorage; storage.setItem(PREFIXO + 't', '1'); storage.removeItem(PREFIXO + 't'); } catch (_) { storage = null; }
    const memoria = new Map(); // fallback quando o navegador bloqueia o armazenamento
    return {
      persistente: !!storage,
      async ler(chave) {
        const bruto = storage ? storage.getItem(PREFIXO + chave) : memoria.get(chave);
        return bruto == null ? undefined : JSON.parse(bruto);
      },
      async gravar(chave, valor) {
        const bruto = JSON.stringify(valor);
        if (storage) storage.setItem(PREFIXO + chave, bruto); else memoria.set(chave, bruto);
      },
      aoMudarEmOutraAba(cb) {
        window.addEventListener('storage', (e) => { if (e.key && e.key.startsWith(PREFIXO)) cb(e.key.slice(PREFIXO.length)); });
      },
    };
  }

  function criarCamadaDeDados(adaptador) {
    return {
      persistente: adaptador.persistente,
      async carregar() {
        const dados = {}, invalidos = [];
        for (const nome of Object.keys(colecoes)) {
          let valor;
          try { valor = await adaptador.ler(nome); } catch (_) { invalidos.push(nome); }
          if (valor !== undefined && !colecoes[nome].valido(valor)) { invalidos.push(nome); valor = undefined; }
          dados[nome] = valor === undefined ? colecoes[nome].padrao() : valor;
        }
        dados.config = { ...configPadrao(), ...dados.config };
        return { dados, invalidos };
      },
      salvar: (colecao, valor) => adaptador.gravar(colecao, valor),
      aoMudarExternamente: (cb) => adaptador.aoMudarEmOutraAba && adaptador.aoMudarEmOutraAba(cb),
    };
  }

     troque este módulo por upload/URL mantendo salvar(blob) -> id, obter(id) -> Blob, remover(id). */
  function criarArmazemImagens() {
    let banco = null, persistente = true; const memoria = new Map();
    const abrir = () => banco || (banco = new Promise((ok, erro) => {
      if (!window.indexedDB) return erro(new Error('sem IndexedDB'));
      const r = indexedDB.open('mesa-imagens', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('imagens', { keyPath: 'id' });
      r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
    }));
    const tx = (modo, fn) => abrir().then((b) => new Promise((ok, erro) => {
      const t = b.transaction('imagens', modo), r = fn(t.objectStore('imagens'));
      t.oncomplete = () => ok(r.result); t.onerror = () => erro(t.error);
    }));
    return {
      get persistente() { return persistente; },
      async salvar(blob) {
        const reg = { id: 'img' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), blob, tipo: blob.type, criadoEm: Date.now() };
        try { await tx('readwrite', (s) => s.put(reg)); } catch (_) { persistente = false; memoria.set(reg.id, reg); }
        return reg.id;
      },
      async obter(id) {
        try { const r = await tx('readonly', (s) => s.get(id)); if (r) return r.blob; } catch (_) { /* usa memória */ }
        const m = memoria.get(id); return m ? m.blob : null;
      },
      async remover(id) { try { await tx('readwrite', (s) => s.delete(id)); } catch (_) { /* ok */ } memoria.delete(id); },
    };
  }

  const CIDADES_PADRAO = { 'barra-do-garcas': 'Barra do Garças', 'pontal-do-araguaia': 'Pontal do Araguaia', aragarcas: 'Aragarças' };
  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'], ORDEM_DIAS = [1, 2, 3, 4, 5, 6, 0];
  function cidMinha(o) { let sel = null; try { sel = JSON.parse(localStorage.getItem('mh_cidade_sel') || 'null'); } catch (e) {} const r = {}; if (sel && sel.slug && sel.nome) r[sel.slug] = sel.nome; Object.keys(o || {}).forEach((k) => { if (!r[k]) r[k] = o[k]; }); return r; }
  const eco = {
    form: { tel: '', senha: '', nome: '', email: '', aceite: false, keep: (() => { try { return localStorage.getItem('mh_keep') !== '0'; } catch (_) { return true; } })(), tipo: '', cidade: '' },
    st: { msg: '', ocupado: false, lojas: null, cat: null, carregando: false, erro: '', ultimo: 0, repetir: false, modo: 'entrar' },
    token() { try { return localStorage.getItem('mh_tk') || sessionStorage.getItem('mh_tk') || ''; } catch (_) { return ''; } },
    guardar(t, manter = true) {   // "manter conectado": localStorage; senão só até fechar o navegador (igual ao MiHelp)
      try { localStorage.removeItem('mh_tk'); sessionStorage.removeItem('mh_tk'); if (t) { localStorage.setItem('mh_keep', manter ? '1' : '0'); (manter ? localStorage : sessionStorage).setItem('mh_tk', t); } } catch (_) { /* sem armazenamento */ }
    },
    cfg: () => estado.config.eco,
    conectado() { const e = estado.config.eco; return !!(e && e.chave); },
    async req(caminho, corpo) {
      const h = { 'content-type': 'application/json' }, t = eco.token(); if (t) h.authorization = 'Bearer ' + t;
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
      try {
        const r = await fetch(ECO_API + caminho, { method: corpo ? 'POST' : 'GET', headers: h, body: corpo ? JSON.stringify(corpo) : undefined, signal: ctl.signal });
        let j = {}; try { j = await r.json(); } catch (_) { /* sem corpo */ }
        if (r.status === 401 && t) { eco.guardar(''); eco.st.lojas = null; eco.st.erro = 'Sua sessão terminou. Entre de novo.'; renderizar(); }
        return { ok: r.ok, status: r.status, j };
      } catch (_) { return { ok: false, status: 0, j: { erro: 'Sem conexão com o servidor (se abriu o arquivo direto do computador, hospede o MESA em dcastrolabs.com).' } }; }
      finally { clearTimeout(to); }
    },
    erro: (r) => (r && r.j && r.j.erro) || 'Não deu certo. Tente de novo.',
    async chaveDe(tel, senha) {   // igual ao MiHelp e ao DOMIN: a senha nunca sai do aparelho
      const te = new TextEncoder(), k = await crypto.subtle.importKey('raw', te.encode(senha), 'PBKDF2', false, ['deriveBits']);
      const b = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: te.encode('mihelp:' + String(tel).trim().replace(/\s+/g, ' ').toLowerCase()), iterations: 120000, hash: 'SHA-256' }, k, 256));
      return btoa(String.fromCharCode.apply(null, b));
    },
    gravarCfg() { return repositorio.salvar('config', estado.config).catch(() => {}); },   // direto: não dispara nova publicação

    /* imagem pequena o bastante para o Worker: tenta lados e qualidades menores até caber */
    async miniatura(blob, passos, maxChars) {
      const bmp = await createImageBitmap(blob);
      for (const [lado, q] of passos) {
        const k = Math.min(1, lado / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        let u = c.toDataURL('image/webp', q); if (!u.startsWith('data:image/webp')) u = c.toDataURL('image/jpeg', q);
        if (u.length <= maxChars) return u;
      }
      return '';
    },
    assinatura() {
      const c = estado.config;
      return JSON.stringify([c.nome, c.descricao, c.aberta, c.logoId, c.capaId, c.categorias, c.tipo, c.cidade, c.contato, c.horario,
        estado.menu.map((i) => [i.id, i.categoria, i.nome, i.descricao, i.precoCentavos, i.disponivel, i.fotoId, i.adicionais])]);
    },
    agendar(colecao) {
      const e = estado.config.eco;
      if (!e || !e.chave || e.auto === false || (colecao !== 'menu' && colecao !== 'config')) return;
      if (eco.assinatura() === e.sig) return;      // pedido novo mexe na config, mas não no que o cliente vê
      clearTimeout(eco.timer); eco.timer = setTimeout(() => { const x = estado.config.eco; if (x && eco.assinatura() !== x.sig) eco.publicar(); }, 2000);
    },
    tic() {
      const e = estado.config.eco; if (!e || !e.chave || !eco.token()) return;
      if (e.auto !== false && eco.assinatura() !== e.sig && !eco.st.ocupado) eco.publicar();
      eco.enviarPendentes();
    },

    /* perfil: usa a rota que o MiHelp e o DOMIN já usam para editar a loja; só mexe no que o MESA edita */
    async publicarPerfil(e) {
      const c = estado.config, nome = c.nome.trim();
      if (nome.length < 3) return 'O nome precisa ter pelo menos 3 letras para ir ao MiHelp.';
      const m = await eco.req('/perfil/meu'); if (!m.ok) return eco.erro(m);
      const l = (m.j.lojas || []).find((x) => x.chave === e.chave);
      if (!l) return 'Essa loja não está mais na sua conta (só o dono publica o perfil).';
      const h = c.horario && Array.isArray(c.horario.d) ? c.horario.d : l.horario && Array.isArray(l.horario.d) ? l.horario.d : [[], [], [], [], [], [], []];
      const corpo = { chave: e.chave, nome, tipo: c.tipo || l.tipo, cidade: c.cidade || l.cidade, endereco: l.endereco, mapa: l.mapa, contato: c.contato == null ? l.contato : c.contato, modo: l.modo,
        descricao: c.descricao.trim(), horario: { p: c.aberta ? 0 : 1, d: h }, chat: l.chat !== 0 };   // fechada no MESA = "fechado temporariamente" no MiHelp
      if (c.logoId && e.logoEnv !== c.logoId) {
        const b = await M.imagens.obter(c.logoId);
        const u = b ? await eco.miniatura(b, [[192, 0.8], [160, 0.7], [128, 0.6], [96, 0.5]], 19000) : '';
        if (u) corpo.logo = u;
      } else if (!c.logoId && e.logoEnv) corpo.logo = '';
      const r = await eco.req('/estabelecimentos/editar', corpo); if (!r.ok) return eco.erro(r);
      e.logoEnv = c.logoId || null;
      /* capa: segunda chamada à parte, para um servidor que ainda não conhece "capa" não derrubar o resto da publicação */
      if (c.capaId && e.capaEnv !== c.capaId) {
        const b = await M.imagens.obter(c.capaId);
        const u = b ? await eco.miniatura(b, [[640, 0.7], [560, 0.6], [480, 0.55], [400, 0.5], [320, 0.45]], 28000) : '';
        if (u) { const r2 = await eco.req('/estabelecimentos/editar', Object.assign({}, corpo, { capa: u })); if (r2.ok) e.capaEnv = c.capaId; }
      } else if (!c.capaId && e.capaEnv) { const r2 = await eco.req('/estabelecimentos/editar', Object.assign({}, corpo, { capa: '' })); if (r2.ok) e.capaEnv = null; }
      return '';
    },
    /* cardápio: o MESA é a fonte; manda tudo, e só as fotos que mudaram */
    async publicarCardapio(e) {
      e.fotos = e.fotos || {};
      const vivos = new Set(estado.menu.map((i) => i.id)), semFoto = [], trocar = [];
      for (const i of estado.menu) { if (i.fotoId && e.fotos[i.id] !== i.fotoId) trocar.push(i); else if (!i.fotoId && e.fotos[i.id]) semFoto.push(i.id); }
      for (const id of Object.keys(e.fotos)) if (!vivos.has(id)) delete e.fotos[id];
      const montar = (fotos) => ({ chave: e.chave, aberta: estado.config.aberta, categorias: estado.config.categorias, semFoto,
        itens: estado.menu.map((i) => ({ id: i.id, categoria: i.categoria, nome: i.nome, descricao: i.descricao, precoCentavos: i.precoCentavos, disponivel: i.disponivel,
          adicionais: (i.adicionais || []).map((a) => ({ nome: a.nome, precoCentavos: a.precoCentavos })) })), fotos });
      let falta = trocar.slice(), primeira = true;
      while (primeira || falta.length) {
        primeira = false;
        const lote = falta.splice(0, 40), fotos = {}, ids = [];
        for (const i of lote) { const b = await M.imagens.obter(i.fotoId); const u = b ? await eco.miniatura(b, [[160, 0.7], [128, 0.6], [112, 0.5], [96, 0.4]], 8800) : ''; if (u) { fotos[i.id] = u; ids.push(i); } else e.fotos[i.id] = i.fotoId; }
        const r = await eco.req('/cardapio/salvar', montar(fotos)); if (!r.ok) return eco.erro(r);
        for (const i of ids) e.fotos[i.id] = i.fotoId;
        for (const id of semFoto) delete e.fotos[id]; semFoto.length = 0;
      }
      return '';
    },
    async publicar(opc) {
      const e = estado.config.eco; if (!e || !e.chave) return;
      if (eco.st.ocupado) { eco.st.repetir = true; return; }
      if (!eco.token()) { eco.st.msg = 'Entre na conta do MiHelp para publicar.'; if (estado.visao === 'conexao') renderizar(); return; }
      eco.st.ocupado = true; eco.st.erro = ''; eco.st.msg = 'Publicando…'; if (estado.visao === 'conexao' || estado.visao === 'cardapio') renderizar();
      const sig = eco.assinatura(); let falha = '';
      try {
        if (opc && opc.tudo) { e.fotos = {}; e.logoEnv = null; e.capaEnv = null; }
        falha = (await eco.publicarPerfil(e)) || (await eco.publicarCardapio(e));
      } catch (x) { falha = 'Não consegui publicar agora.'; }
      eco.st.ocupado = false;
      if (falha) { eco.st.msg = ''; eco.st.erro = falha; }
      else { e.sig = sig; e.ult = Date.now(); eco.st.msg = 'Publicado no MiHelp às ' + new Date(e.ult).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '.'; }
      await eco.gravarCfg();
      if (eco.st.repetir) { eco.st.repetir = false; eco.agendar('menu'); }
      if (estado.visao === 'conexao' || estado.visao === 'cardapio') renderizar();
    },

    /* faturamento: um lançamento de entrada no financeiro da loja (o DOMIN lê de lá). O "rid" impede lançar o mesmo pedido duas vezes. */
    async faturar(p) {
      const e = estado.config.eco;
      if (!e || !e.chave || e.fat === false || p.origem === 'simulador' || p.fat === 1 || !eco.token()) return;
      const valor = Pedidos.total(p) / 100; if (!(valor > 0)) return;
      const forma = /^pix/i.test(p.pagamento) ? 'pix' : /cart/i.test(p.pagamento) ? 'cartao' : 'dinheiro';
      const r = await eco.req('/gestao/mov', { chave: e.chave, tipo: 'entrada', valor, forma, desc: ('MESA #' + p.id + ' · ' + p.nome).slice(0, 80), rid: 'mesa-' + p.id + '-' + p.criadoEm });
      if (r.ok && r.j && r.j.ok) { p.fat = 1; await repositorio.salvar('pedidos', estado.pedidos).catch(() => {}); if (estado.visao === 'conexao') renderizar(); }
    },
    pendentes: () => estado.pedidos.filter((p) => p.status === 'entregue' && p.origem !== 'simulador' && !p.fat),
    async enviarPendentes() { if (eco.st.enviando) return; eco.st.enviando = true; try { for (const p of eco.pendentes().slice(0, 20)) await eco.faturar(p); } finally { eco.st.enviando = false; } },

    alternar(chave, valor) { const e = estado.config.eco; if (!e) return; e[chave] = valor; eco.gravarCfg(); if (chave === 'auto' && valor) eco.agendar('menu'); },

    /* telas */
    async abrirTela() {
      if (!eco.token() || eco.conectado() || eco.st.carregando) return;
      eco.st.carregando = true; eco.st.erro = ''; renderizar();
      const r = await eco.req('/perfil/meu');
      eco.st.carregando = false;
      if (r.ok && r.j && r.j.ok) { eco.st.lojas = r.j.lojas || []; eco.st.cat = { tipos: r.j.tipos || [], cidades: cidMinha(r.j.cidades || {}) }; }
      else eco.st.erro = eco.erro(r);
      renderizar();
    },
    async carregarCat() {
      if (eco.st.cat || eco.st.catBusca || !eco.token()) return;
      eco.st.catBusca = true;
      const r = await eco.req('/perfil/meu');
      eco.st.catBusca = false;
      if (r.ok && r.j && r.j.ok) { eco.st.cat = { tipos: r.j.tipos || [], cidades: cidMinha(r.j.cidades || {}) }; if (estado.visao === 'estabelecimento') renderizar(); }
    },
    faixa() {
      const e = estado.config.eco;
      if (!e || !e.chave) return '<p class="callout">Este cardápio ainda só existe neste navegador. <button class="lnk" data-a="ir" data-v="conexao">Conectar ao MiHelp e ao DOMIN</button></p>';
      return `<p class="callout">${eco.st.erro ? esc(eco.st.erro) : esc(eco.st.msg || (e.ult ? 'Publicado no MiHelp.' : 'Conectado ao MiHelp.'))} <button class="lnk" data-a="ir" data-v="conexao">Conexão</button></p>`;
    },
    acoes: {
      ecoModo(t) { eco.st.modo = t.dataset.m === 'criar' ? 'criar' : 'entrar'; eco.st.erro = ''; },
      async ecoEntrar() {
        const f = eco.form, tel = String(f.tel).replace(/\D/g, '');
        if (tel.length < 10 || !f.senha) { eco.st.erro = 'Informe o telefone com DDD e a senha.'; return; }
        if (!(window.crypto && crypto.subtle)) { eco.st.erro = 'Este navegador só entra em páginas https.'; return; }
        eco.st.erro = 'Entrando…'; renderizar();
        const r = await eco.req('/conta/entrar', { tel, chave: await eco.chaveDe(tel, f.senha), identificador: tel });
        f.senha = '';
        if (r.ok && r.j && r.j.token) { eco.guardar(r.j.token, f.keep); eco.st.erro = ''; eco.st.lojas = null; if (!eco.conectado()) estado.visao = 'conexao'; await eco.abrirTela(); renderizar(); return false; }
        eco.st.erro = r.status === 401 ? 'Telefone ou senha incorretos.' : r.status === 404 ? 'Não achei conta com esse telefone. Toque em "Criar conta".' : r.status === 429 ? 'Muitas tentativas. Espere 15 minutos.' : eco.erro(r);
      },
      async ecoNovaConta() {   // mesma conta do MiHelp e do DOMIN: /conta/criar do mesmo Worker
        const f = eco.form, tel = String(f.tel).replace(/\D/g, ''), nome = f.nome.trim().replace(/\s+/g, ' '), email = f.email.trim();
        if (nome.length < 2) { eco.st.erro = 'Digite seu nome.'; return; }
        if (tel.length < 10) { eco.st.erro = 'Digite o telefone com DDD.'; return; }
        if (email.indexOf('@') < 1) { eco.st.erro = 'Digite um e-mail válido.'; return; }
        if (f.senha.length < 6) { eco.st.erro = 'Crie uma senha com pelo menos 6 caracteres.'; return; }
        if (!f.aceite) { eco.st.erro = 'Marque a caixinha de aceite para continuar.'; return; }
        if (!(window.crypto && crypto.subtle)) { eco.st.erro = 'Este navegador só cria conta em páginas https.'; return; }
        eco.st.erro = 'Criando a conta…'; renderizar();
        let ind = ''; try { ind = localStorage.getItem('mh_ind') || ''; } catch (_) { /* sem armazenamento */ }
        const r = await eco.req('/conta/criar', { nome, chave: await eco.chaveDe(tel, f.senha), papel: 'cliente', oficio: '', tel, email, indicador: ind, cidade: '' });
        f.senha = '';
        if (r.ok && r.j && r.j.token) { eco.guardar(r.j.token, f.keep); eco.st.erro = ''; eco.st.lojas = null; eco.st.modo = 'entrar'; estado.visao = 'conexao'; await eco.abrirTela(); renderizar(); return false; }
        eco.st.erro = r.status === 409 ? 'Esse telefone já tem conta. Toque em "Já tenho conta" para entrar.' : eco.erro(r);
      },
      async ecoUsar(t) {
        const l = (eco.st.lojas || []).find((x) => x.chave === t.dataset.k); if (!l) return false;
        const pend = estado.pedidos.filter((p) => p.status === 'entregue' && !p.fat && p.origem !== 'simulador');
        pend.forEach((p) => { p.fat = 2; });   // histórico anterior à conexão não vira faturamento sozinho
        await repositorio.salvar('pedidos', estado.pedidos).catch(() => {});
        const c = estado.config;   // o MESA ainda não tem estes dados: começa com o que já está no MiHelp (não sobrescreve a loja)
        if (!c.nome.trim() || c.nome === 'Meu estabelecimento') c.nome = l.nome;
        else if (l.nome && c.nome.trim() !== l.nome.trim()) {   // evita renomear sem querer uma loja que já existe no MiHelp
          if (confirm('Essa loja no MiHelp se chama "' + l.nome + '", mas o MESA está com "' + c.nome.trim() + '".\n\nOK = usar o nome do MiHelp ("' + l.nome + '").\nCancelar = manter o nome do MESA e renomear a loja no MiHelp.')) { c.nome = l.nome; if (l.descricao) c.descricao = l.descricao; if (l.tipo) c.tipo = l.tipo; }
        }
        if (!c.descricao && l.descricao) c.descricao = l.descricao;
        if (c.tipo == null && l.tipo) c.tipo = l.tipo;
        if (c.cidade == null && l.cidade) c.cidade = l.cidade;
        if (c.contato == null && l.contato != null) c.contato = l.contato;
        if (!c.horario && l.horario && Array.isArray(l.horario.d)) c.horario = { d: l.horario.d.map((x) => (Array.isArray(x) ? x.slice() : [])) };
        estado.config.eco = { chave: l.chave, nome: l.nome, auto: true, fat: true, fotos: {}, sig: '', ult: 0, logoEnv: null };
        await eco.gravarCfg(); eco.st.msg = ''; eco.st.erro = ''; eco.publicar({ tudo: true });
      },
      async ecoApagar(t) {
        const l = (eco.st.lojas || []).find((x) => x.chave === t.dataset.k); if (!l) return false;
        if (!confirm('Apagar a loja "' + l.nome + '" do MiHelp?\n\nIsso remove o perfil, a equipe e o cardápio publicado. Não dá para desfazer.')) return false;
        const r = await eco.req('/estabelecimentos/apagar', { chave: l.chave });
        if (!(r.ok && (!r.j || r.j.ok !== false))) { eco.st.erro = eco.erro(r); return; }
        eco.st.lojas = (eco.st.lojas || []).filter((x) => x.chave !== l.chave); eco.st.erro = '';
        if (estado.config.eco && estado.config.eco.chave === l.chave) { estado.config.eco = null; await eco.gravarCfg(); }
        aviso('Loja apagada.');
      },
      async ecoCriar() {
        const f = eco.form, c = estado.config, cat = eco.st.cat || { tipos: [], cidades: {} };
        const tipo = f.tipo || '', cidade = f.cidade || Object.keys(cat.cidades)[0] || 'barra-do-garcas';
        if (c.nome.trim().length < 3) { eco.st.erro = 'Dê um nome ao estabelecimento (aba Cardápio) com pelo menos 3 letras.'; return; }
        if (!tipo || !(cat.tipos.includes(tipo) || tipo === 'Outro')) { eco.st.erro = 'Digite o tipo de negócio e toque numa opção da lista (ou "Outro").'; return; }
        eco.st.erro = 'Criando a loja…'; renderizar();
        const r = await eco.req('/estabelecimentos', { nome: c.nome.trim(), tipo, cidade, descricao: c.descricao.trim(), modo: 'contato', atende: true, funcao: 'Dono' });
        if (!(r.ok && r.j && r.j.ok)) { eco.st.erro = eco.erro(r); return; }
        eco.st.erro = ''; eco.st.lojas = [{ chave: r.j.chave, nome: c.nome.trim() }];
        return eco.acoes.ecoUsar({ dataset: { k: r.j.chave } });
      },
      ecoPublicar() { eco.publicar({ tudo: true }); return false; },
      ecoAntigos() {
        let n = 0; estado.pedidos.forEach((p) => { if (p.fat === 2) { delete p.fat; n++; } });
        repositorio.salvar('pedidos', estado.pedidos).catch(() => {}); aviso(n ? n + ' pedido(s) antigo(s) na fila para o DOMIN.' : 'Nada antigo para enviar.'); eco.enviarPendentes();
      },
      ecoTrocar() { estado.config.eco = null; eco.st.lojas = null; eco.gravarCfg(); eco.abrirTela(); },
      ecoSair() { eco.guardar(''); estado.config.eco = null; eco.st.lojas = null; eco.st.erro = ''; eco.st.modo = 'entrar'; eco.gravarCfg(); aviso('Você saiu da conta.'); },
    },
  };

  /* ---------- telas ---------- */
  function cartaoPedido(o) {
    const min = Pedidos.minutosDesde(o), prox = Pedidos.proximaEtapa(o);
    return `<article class="oc${estado.novos.has(o.id) ? ' fresh' : ''}"><div class="r"><b>#${o.id} ${esc(o.nome)}</b><span class="age ${Pedidos.nivelAtraso(min)}" data-id="${o.id}">${min} min</span></div>
<div><span class="tg">${o.tipo === 'entrega' ? 'Entrega' : 'Retirada'}</span>${o.origem === 'simulador' ? '<span class="tg test">Teste</span>' : ''}<span class="mu sm">${esc(o.pagamento)}</span></div>
<ul>${o.itens.map((i) => `<li>${i.qtd}× ${esc(i.nome)}${i.adicionais && i.adicionais.length ? `<div class="mu sm">+ ${i.adicionais.map(esc).join(', ')}</div>` : ''}${i.obs ? `<div class="note">“${esc(i.obs)}”</div>` : ''}</li>`).join('')}</ul>
${o.obs ? `<p class="note">“${esc(o.obs)}”</p>` : ''}${o.tipo === 'entrega' ? `<p class="mu sm">${esc(o.endereco)}</p>` : ''}
<div class="r"><b>${Money.formatar(Pedidos.total(o))}</b><span class="mu sm">${esc(o.tel)}</span></div>
<div class="acts2">${prox ? `<button class="btn pri full" data-a="avancar" data-id="${o.id}">${prox.acao}</button>` : ''}${Pedidos.podeRecusar(o) ? `<button class="btn full" data-a="recusar" data-id="${o.id}">Recusar</button>` : ''}</div></article>`;
  }

  function telaPedidos() {
    const ind = Pedidos.indicadores(estado.pedidos), aberta = estado.config.aberta;

      const etapa = Pedidos.ETAPAS[chave];

<div class="board">${colunas}</div>`;

  /* ---------- imagens ---------- */
  const urlsImagens = new Map();
  const urlImagem = (id) => (id && urlsImagens.get(id)) || null;
  const MARCA = document.querySelector('link[rel=icon]').href;
  async function garantirImagens() {
    const ids = new Set([estado.config.capaId, estado.config.logoId, ...estado.menu.map((i) => i.fotoId)].filter(Boolean));
    for (const id of ids) if (!urlsImagens.has(id)) { const b = await M.imagens.obter(id); if (b) urlsImagens.set(id, URL.createObjectURL(b)); }
  }
  async function removerImagem(id) {
    if (!id) return;
    await M.imagens.remover(id);
    const u = urlsImagens.get(id); if (u) URL.revokeObjectURL(u); urlsImagens.delete(id);
  }
  async function processarImagem(arquivo, maxLado) {   // reduz e padroniza antes de guardar
    if (!arquivo || !arquivo.type.startsWith('image/')) throw new Error('Escolha um arquivo de imagem.');
    if (arquivo.size > 15 * 1024 * 1024) throw new Error('Imagem muito grande (máximo 15 MB).');
    let bmp; try { bmp = await createImageBitmap(arquivo); } catch (_) { throw new Error('Formato de imagem não suportado.'); }
    const k = Math.min(1, maxLado / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((ok, erro) => c.toBlob((b) => (b ? ok(b) : erro(new Error('Não foi possível processar a imagem.'))), 'image/webp', 0.86));
  }
  const foto = (id, classe, alt) => { const u = urlImagem(id); return u ? `<img class="${classe}" src="${u}" alt="${esc(alt)}" loading="lazy">` : `<div class="${classe} vazio"><img src="${MARCA}" alt=""></div>`; };
  const avisoSalvo = (texto) => aviso(M.imagens.persistente ? texto : texto + ' As fotos não serão mantidas ao recarregar (IndexedDB indisponível).');

  /* ---------- cardápio (administração) ---------- */
  const campoImagem = (tipo, rotulo, id) => `<div class="imgcampo">${foto(id, tipo === 'capa' ? 'thumb thumb-capa' : 'thumb', rotulo)}<div class="g"><b>${rotulo}</b><div class="mu sm">${id ? 'Imagem definida' : 'Sem imagem'}</div></div><label class="btn">${id ? 'Trocar' : 'Enviar'}<input class="vh" type="file" accept="image/*" data-img="${tipo}" aria-label="${id ? 'Trocar' : 'Enviar'} ${rotulo.toLowerCase()}"></label>${id ? `<button class="btn" data-a="removerImagemPerfil" data-t="${tipo}">Remover</button>` : ''}</div>`;

  const linhaCardapio = (i) => `<div class="row${i.disponivel ? '' : ' off'}">${foto(i.fotoId, 'thumb', i.nome)}<div class="g"><b>${esc(i.nome)}</b><div class="mu sm">${esc(i.descricao)}</div></div><label class="pr">R$<input data-preco data-id="${i.id}" value="${Money.paraCampo(i.precoCentavos)}" inputmode="decimal" aria-label="Preço de ${esc(i.nome)}"></label><button class="btn" data-a="editar" data-id="${i.id}" aria-label="Editar ${esc(i.nome)}">Editar</button><button class="sw" role="switch" aria-checked="${i.disponivel}" aria-label="Disponibilidade de ${esc(i.nome)}" data-a="alternar" data-id="${i.id}"><i></i></button><span class="sm mu av2">${i.disponivel ? 'Disponível' : 'Esgotado'}</span></div>`;

  function telaCardapio() {
    const c = estado.config;
    return `<header class="top"><div><h1>Cardápio</h1><p class="mu">Edite aqui e confira na aba Prévia. O que você mudar aqui vai para o MiHelp sozinho quando a loja estiver conectada.</p></div></header>
${eco.faixa()}<section class="mc"><h2>Perfil público</h2>
<label class="f">Nome do estabelecimento<input data-p="nome" value="${esc(c.nome)}"></label>
<label class="f">Descrição<input data-p="descricao" value="${esc(c.descricao)}" placeholder="Ex.: Hambúrgueres artesanais"></label>
<label class="f">Informações<input data-p="informacoes" value="${esc(c.informacoes)}" placeholder="Ex.: horário e formas de entrega"></label>
${campoImagem('capa', 'Foto de capa', c.capaId)}${campoImagem('logo', 'Logotipo', c.logoId)}</section>
<button class="btn pri add-btn" data-a="editar">Adicionar item</button>
${c.categorias.map((cat) => `<section class="mc"><h2>${esc(cat)}</h2>${estado.menu.filter((i) => i.categoria === cat).map(linhaCardapio).join('') || '<p class="mu sm">Sem itens nesta categoria.</p>'}</section>`).join('')}`;
  }

  /* ---------- janelas: editor de item (admin) e detalhes do produto (cliente) ---------- */
  function modalEditor() {

    return `<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="sh-pad"><div class="r"><h2 id="mt">${e.id ? 'Editar item' : 'Novo item'}</h2><button class="btn" data-a="fechar">Fechar</button></div>
<div class="fprev">${atual ? `<img src="${atual}" alt="Prévia da foto">` : `<div class="vazio"><img src="${MARCA}" alt=""></div>`}</div>
<div class="acts"><label class="btn">${atual ? 'Trocar foto' : 'Enviar foto'}<input class="vh" type="file" accept="image/*" data-img="item" aria-label="${atual ? 'Trocar foto' : 'Enviar foto'} do item"></label>${atual ? '<button class="btn" data-a="removerFotoItem">Remover foto</button>' : ''}</div>
<p class="mu sm">A foto só é gravada ao salvar o item.</p>
<label class="f">Nome<input data-e="nome" value="${esc(e.nome)}" placeholder="Ex.: X-Salada"></label>
<label class="f">Preço<input data-e="preco" value="${esc(e.preco)}" inputmode="decimal" placeholder="0,00"></label>
<label class="f">Categoria<select data-e="categoria">${estado.config.categorias.map((c) => `<option${c === e.categoria ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>

  function fmtTel(v) {   // 66988887777 -> (66) 98888-7777

  }
  function rascunhoLoja() {
    const c = estado.config, cat = eco.st.cat;

      const f = [0, 1].map((k) => (fx[k] ? String(fx[k]).split('-') : ['', '']));
      return { on: fx.length > 0, f };
    });
    return { nome: c.nome, tipo: c.tipo || '', cidade: c.cidade || '', contato: fmtTel(c.contato), h };
  }
  function horarioDoRascunho(L) {   // devolve { d } ou { erro }
    const d = [[], [], [], [], [], [], []];
    for (const i of ORDEM_DIAS) {
      const r = L.h[i]; if (!r.on) continue;
      const faixas = [];
      r.f.forEach((p, k) => { if (p[0] || p[1]) faixas.push([p, k]); });
      if (!faixas.length) return { erro: DIAS[i] + ': preencha a hora que abre e a que fecha, ou desmarque o dia.' };
      for (const [p, k] of faixas) { if (!p[0] || !p[1]) return { erro: DIAS[i] + ' (' + (k + 1) + 'ª faixa): falta a hora que ' + (p[0] ? 'fecha' : 'abre') + '.' }; d[i].push(p[0] + '-' + p[1]); }
    }
    return { d };
  }

    if (!el || !el.closest || !el.closest('#view, #nav, #modal, #entrada')) return null;
    let seletor = el.tagName.toLowerCase();
    for (const [k, v] of Object.entries(el.dataset)) seletor += `[data-${k.replace(/[A-Z]/g, (m) => '-' + m.toLowerCase())}="${CSS.escape(v)}"]`;
    return Object.keys(el.dataset).length ? seletor : null;
  }

  function renderizar() {
    const ativo = document.activeElement, seletor = seletorDoFoco(ativo);
    const selecao = ativo && typeof ativo.selectionStart === 'number' ? [ativo.selectionStart, ativo.selectionEnd] : null;
    const celularAtual = $('.ph-body'), quadro = $('.board'), rolagemY = window.scrollY;
    const rolagemCelular = estado.resetarRolagem || !celularAtual ? 0 : celularAtual.scrollTop;
    const rolagemQuadro = quadro ? quadro.scrollLeft : 0;
    estado.resetarRolagem = false;

    const logado = !!eco.token();   // sem conta do MiHelp não há painel: primeiro a entrada, como no DOMIN
    document.body.classList.toggle('deslogado', !logado);
    if (!logado) {
      $('#entrada').innerHTML = telaEntrada();
      document.querySelectorAll('img[data-dc]').forEach((i) => { i.src = DCASTRO; });
      if (seletor) { const el = document.querySelector(seletor); if (el) { el.focus({ preventScroll: true }); if (selecao) { try { el.setSelectionRange(...selecao); } catch (_) { /* tipo sem seleção */ } } } }
      return;
    }
    $('#entrada').innerHTML = '';

    document.querySelectorAll('.loja-nome').forEach((el) => { el.textContent = estado.config.nome; });
    $('#nav').innerHTML = NAVEGACAO.map(([chave, rotulo]) => {
      const n = chave === 'pedidos' ? estado.pedidos.filter((o) => o.status === 'novo').length : 0;
      return `<button class="nv" data-a="ir" data-v="${chave}"${estado.visao === chave ? ' aria-current="page"' : ''}><span>${rotulo}</span>${n ? `<span class="cnt">${n}</span>` : ''}</button>`;
    }).join('');
    $('#view').innerHTML = TELAS[estado.visao]();
    renderizarModal();
    document.querySelectorAll('img[data-dc]').forEach((i) => { i.src = DCASTRO; });

    const novoCelular = $('.ph-body'), novoQuadro = $('.board');
    if (novoCelular) novoCelular.scrollTop = rolagemCelular;
    if (novoQuadro) novoQuadro.scrollLeft = rolagemQuadro;
    window.scrollTo(0, rolagemY);
    if (estado.focarModal) { const b = document.querySelector('#modal [data-a="fechar"]'); if (b) b.focus(); estado.focarModal = false; }
    else if (estado.restaurar) { const el = document.querySelector(estado.restaurar); if (el) el.focus({ preventScroll: true }); estado.restaurar = null; }
    else if (seletor) {
      const el = document.querySelector(seletor);
      if (el) { el.focus({ preventScroll: true }); if (selecao) { try { el.setSelectionRange(...selecao); } catch (_) { /* tipo sem seleção */ } } }
    }
    estado.novos.clear();
  }

  /* ---------- ações ---------- */
  function interpretarAdicionais(texto, existentes) {   // "nome; preço", um por linha
    const lista = [];
    for (const [k, bruto] of texto.split('\n').entries()) {
      const linha = bruto.trim(); if (!linha) continue;
      const [nome, preco = '0'] = linha.split(';').map((s) => s.trim()), centavos = Money.interpretar(preco || '0');
      if (!nome || Number.isNaN(centavos)) return { erro: `Adicional da linha ${k + 1}: use “nome; preço”.` };
      const antigo = existentes.find((a) => a.nome === nome);
      lista.push({ id: antigo ? antigo.id : 'a' + Date.now().toString(36) + k, nome, precoCentavos: centavos });
    }
    return { lista };
  }

  const acoes = {
    ir(t) { estado.visao = t.dataset.v; estado.resetarRolagem = true; window.scrollTo(0, 0); if (t.dataset.v === 'estabelecimento') estado.loja = null; if (t.dataset.v === 'conexao') eco.abrirTela(); },
    horCopiar() { const L = estado.loja, m = L && L.h[1]; if (!m) return false; L.h = L.h.map(() => ({ on: m.on, f: m.f.map((p) => p.slice()) })); aviso('Horário da segunda copiado para todos os dias.'); },
    salvarLoja() {
      const L = estado.loja, c = estado.config; if (!L) return false;
      const nome = L.nome.trim(), dig = String(L.contato).replace(/\D/g, '');
      if (nome.length < 3) { aviso('Dê um nome à loja, com pelo menos 3 letras.'); return false; }
      { const lt = (eco.st.cat && eco.st.cat.tipos) || []; if (!L.tipo || (lt.length && L.tipo !== c.tipo && L.tipo !== 'Outro' && !lt.includes(L.tipo))) { aviso('Digite o tipo de negócio e toque numa opção da lista (ou "Outro").'); return false; } }
      if (dig && (dig.length < 10 || dig.length > 13)) { aviso('WhatsApp: informe com DDD, por exemplo (66) 99999-9999.'); return false; }
      const hr = horarioDoRascunho(L); if (hr.erro) { aviso(hr.erro); return false; }
      c.nome = nome; c.tipo = L.tipo; c.cidade = L.cidade; c.contato = dig; c.horario = { d: hr.d };
      estado.loja = null; salvar('config'); clearTimeout(eco.timer);
      if (eco.conectado() && eco.token()) { aviso('Salvo. Enviando para o MiHelp…'); eco.publicar(); } else aviso('Salvo neste aparelho. Conecte a loja ao MiHelp na aba Conexão para publicar.');
    },
    tela(t) { estado.tela = t.dataset.s; estado.resetarRolagem = true; },
    avancar(t) {
      const p = buscarPedido(t.dataset.id), prox = p && Pedidos.proximaEtapa(p);
      if (!prox) return false;
      p.status = prox.para; if (p.status === 'entregue') { p.entregueEm = Date.now(); eco.faturar(p); } salvar('pedidos'); aviso(`Pedido #${p.id} atualizado`);
    },
    recusar(t) {
      const p = buscarPedido(t.dataset.id);
      if (!p || !Pedidos.podeRecusar(p)) return false;
      p.status = 'cancelado'; salvar('pedidos'); aviso(`Pedido #${p.id} recusado`);
    },
    abrir() { estado.config.aberta = !estado.config.aberta; salvar('config'); },
    simular() {
      if (!estado.config.aberta) { aviso('Fechada: o cliente não consegue pedir.'); return false; }
      const ativos = estado.menu.filter((i) => i.disponivel);
      if (!ativos.length) { aviso('Ative ao menos um item no cardápio.'); return false; }
      const sorteio = ativos.slice().sort(() => Math.random() - 0.5).slice(0, 1 + Math.floor(Math.random() * Math.min(3, ativos.length)));
      const entrega = Math.random() > 0.35, numero = estado.config.proximoPedido;
      const p = criarPedido({
        nome: `Cliente de teste ${numero}`, tel: '(00) 00000-0000', tipo: entrega ? 'entrega' : 'retirada',
        end: entrega ? `Endereço de teste ${numero}` : '', pag: 'Pix', obs: '', origem: 'simulador',
        itens: sorteio.map((i) => ({ produtoId: i.id, nome: i.nome, qtd: 1 + Math.floor(Math.random() * 2), precoCentavos: i.precoCentavos })),
      });
      aviso(`Pedido de teste #${p.id} criado`);
    },
    alternar(t) { const i = buscarItem(t.dataset.id); i.disponivel = !i.disponivel; salvar('menu'); },
    editar(t) {
      estado.retorno = seletorDoFoco(document.activeElement);
      const i = t.dataset.id ? buscarItem(t.dataset.id) : null, base = { novaFoto: null, previewUrl: null, removerFoto: false };
      estado.editor = i
        ? { ...base, id: i.id, nome: i.nome, preco: Money.paraCampo(i.precoCentavos), categoria: i.categoria, descricao: i.descricao, fotoId: i.fotoId || null, adicionais: adicionaisDoItem(i).map((a) => `${a.nome}; ${Money.paraCampo(a.precoCentavos)}`).join('\n') }
        : { ...base, id: null, nome: '', preco: '', categoria: estado.config.categorias[0], descricao: '', fotoId: null, adicionais: '' };
      estado.focarModal = true;
    },
    removerFotoItem() { const e = estado.editor; if (e.previewUrl) URL.revokeObjectURL(e.previewUrl); e.novaFoto = null; e.previewUrl = null; e.removerFoto = true; },
    async salvarItem() {
      const e = estado.editor, nome = e.nome.trim(), preco = Money.interpretar(e.preco);
      if (!nome || Number.isNaN(preco)) { aviso('Informe o nome e um preço válido.'); return false; }
      const item = e.id ? buscarItem(e.id) : null, ad = interpretarAdicionais(e.adicionais, item ? adicionaisDoItem(item) : []);
      if (ad.erro) { aviso(ad.erro); return false; }
      const fotoAntiga = item ? item.fotoId || null : null; let fotoId = fotoAntiga;
      try { if (e.novaFoto) fotoId = await M.imagens.salvar(e.novaFoto); else if (e.removerFoto) fotoId = null; }
      catch (_) { aviso('Não foi possível salvar a foto.'); return false; }
      const dados = { categoria: e.categoria || estado.config.categorias[0], nome, descricao: e.descricao.trim(), precoCentavos: preco, adicionais: ad.lista, fotoId };
      if (item) Object.assign(item, dados); else estado.menu.push({ id: 'p' + Date.now().toString(36), disponivel: true, ...dados });
      if (fotoAntiga && fotoAntiga !== fotoId) await removerImagem(fotoAntiga);
      salvar('menu'); await garantirImagens(); fecharModais(); avisoSalvo('Item salvo no cardápio.');
    },
    async removerImagemPerfil(t) {
      const campo = t.dataset.t === 'capa' ? 'capaId' : 'logoId', antigo = estado.config[campo];
      estado.config[campo] = null; salvar('config'); await removerImagem(antigo);
    },
    detalhe(t) { estado.retorno = seletorDoFoco(document.activeElement); estado.detalhe = { itemId: t.dataset.id, qtd: 1, adic: [], obs: '' }; estado.focarModal = true; },
    pedir(t) {
      const i = buscarItem(t.dataset.id);
      if (!estado.config.aberta) { aviso('O estabelecimento está fechado.'); return false; }
      if (!i || !i.disponivel) return false;
      if (adicionaisDoItem(i).length) return acoes.detalhe(t);   // com adicionais, o cliente escolhe na janela
      adicionarAoCarrinho(i.id, 1, [], '');
    },
    fechar() { fecharModais(); },
    dmais() { if (estado.detalhe.qtd < 20) estado.detalhe.qtd++; },
    dmenos() { if (estado.detalhe.qtd > 1) estado.detalhe.qtd--; },
    adicionarDetalhe() {
      const d = estado.detalhe, item = buscarItem(d.itemId);
      if (!estado.config.aberta) { aviso('O estabelecimento está fechado.'); return false; }
      if (!item || !item.disponivel) return false;
      adicionarAoCarrinho(item.id, d.qtd, d.adic, d.obs); fecharModais(); aviso('Adicionado ao carrinho');
    },
    irCat(t) { const el = document.getElementById('cat-' + t.dataset.k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return false; },
    mais(t) {
      if (!estado.config.aberta) { aviso('O estabelecimento está fechado.'); return false; }
      const l = estado.carrinho[t.dataset.id]; if (l) l.qtd++;
    },
    menos(t) { const l = estado.carrinho[t.dataset.id]; if (!l) return; l.qtd--; if (l.qtd <= 0) delete estado.carrinho[t.dataset.id]; },
    trocarDados() { estado.cliente.trocar = true; },
    localizacao() {
      const c = estado.cliente;
      if (!navigator.geolocation) { aviso('Seu aparelho não deixa usar a localização. Escreva o endereço.'); return false; }
      return new Promise((ok) => navigator.geolocation.getCurrentPosition(
        (p) => { const g = p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5); c.end = (c.end.trim() ? c.end.trim() + ' · ' : '') + 'Localização: https://maps.google.com/?q=' + g; aviso('Localização adicionada.'); ok(true); },
        () => { aviso('Não consegui pegar a localização. Escreva o endereço.'); ok(false); },
        { enableHighAccuracy: true, timeout: 10000 }));
    },
    tipo(t) {
      const c = estado.cliente; c.tipo = t.dataset.t;
      if (c.pag.startsWith('Cartão')) c.pag = 'Cartão na ' + (c.tipo === 'entrega' ? 'entrega' : 'retirada');
    },
    enviar() {
      const c = estado.cliente;
      if (!qtdCarrinho()) c.erro = 'Seu carrinho está vazio.';
      else if (!c.nome.trim() || c.tel.replace(/\D/g, '').length < 10) c.erro = 'Informe seu nome e um telefone com DDD.';
      else if (c.tipo === 'entrega' && !c.end.trim()) c.erro = 'Informe o endereço de entrega.';
      else {
        c.erro = '';
        const p = criarPedido({
          nome: c.nome.trim(), tel: c.tel.trim(), tipo: c.tipo, end: c.end.trim(), pag: c.pag, obs: c.obs.trim(), origem: 'cardapio-digital',
          itens: linhasCarrinho().map((l) => ({ produtoId: l.item.id, nome: l.item.nome, qtd: l.qtd, precoCentavos: l.unitario, adicionais: l.extras.map((a) => a.nome), obs: l.obs })),
        });
        try { localStorage.setItem('mesa_cliente_v1', JSON.stringify({ nome: c.nome.trim(), tel: c.tel.trim(), end: c.end.trim() })); } catch (e) {}
        c.trocar = false;
        estado.ultimoPedido = p.id; estado.carrinho = {}; estado.tela = 'ok'; estado.resetarRolagem = true;
      }
    },
  };


  /* digitar e escolher: lista de sugestões para qualquer input com data-combo */
  (function () {
    const norm = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    let box = null, alvo = null;
    const fecha = () => { if (box) box.remove(); box = null; alvo = null; };
    function opcoes(inp) { try { return JSON.parse(inp.dataset.combo || '[]'); } catch (e) { return []; } }
    function escolhe(inp, v) { inp.value = v; inp.dataset.ok = '1'; fecha(); inp.dispatchEvent(new Event('input', { bubbles: true })); }
    function abre(inp) {
      const k = norm(inp.value).trim(), todas = opcoes(inp);
      fecha();
      if (!k || todas.some((t) => norm(t) === k)) return;
      const m = todas.filter((t) => norm(t).includes(k)).sort((a, b) => (norm(a).startsWith(k) ? 0 : 1) - (norm(b).startsWith(k) ? 0 : 1)).slice(0, 8);
      box = document.createElement('div'); box.className = 'cbx'; alvo = inp;
      if (!m.length) { const p = document.createElement('p'); p.textContent = 'Nada com esse nome. Use "Outro".'; box.append(p); }
      m.forEach((t, n) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (!n) b.className = 'on'; b.addEventListener('mousedown', (e) => e.preventDefault()); b.addEventListener('click', () => escolhe(inp, t)); box.append(b); });
      const r = inp.getBoundingClientRect(); box.style.left = r.left + 'px'; box.style.top = (r.bottom + 4) + 'px'; box.style.width = r.width + 'px';
      document.body.append(box);
    }
    document.addEventListener('input', (e) => { const t = e.target; if (t && t.dataset && t.dataset.combo !== undefined) abre(t); });
    document.addEventListener('keydown', (e) => { if (!alvo || e.target !== alvo) return; if (e.key === 'Enter') { const b = box && box.querySelector('button'); if (b) { e.preventDefault(); b.click(); } } else if (e.key === 'Escape') fecha(); });
    document.addEventListener('mousedown', (e) => { if (box && !box.contains(e.target) && e.target !== alvo) fecha(); });
    window.addEventListener('scroll', fecha, true);
  })();
  Object.assign(acoes, eco.acoes);
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-a]');
    if (!t && e.target.classList.contains('ov')) { fecharModais(); renderizar(); return; }
    if (!t || !acoes[t.dataset.a]) return;
    const r = acoes[t.dataset.a](t);
    if (r && typeof r.then === 'function') r.then((x) => { if (x !== false) renderizar(); });
    else if (r !== false) renderizar();
  });
  document.addEventListener('input', (e) => {
    const d = e.target.dataset;
    if (d.f) estado.cliente[d.f] = e.target.value;
    if (d.e && estado.editor) estado.editor[d.e] = e.target.value;
    if (d.p) estado.config[d.p] = e.target.value;
    if (d.ef) eco.form[d.ef] = e.target.value;
    if (d.ec) eco.form[d.ec] = e.target.checked;
    if (d.l && estado.loja) estado.loja[d.l] = e.target.value;
    if (d.hf && estado.loja) { const [i, k, j] = d.hf.split(',').map(Number); estado.loja.h[i].f[k][j] = e.target.value; }
    if ('o' in d && estado.detalhe) estado.detalhe.obs = e.target.value;
  });
  document.addEventListener('change', async (e) => {
    const el = e.target, d = el.dataset;
    if (d.eco) { eco.alternar(d.eco, el.checked); renderizar(); return; }
    if (d.hon !== undefined && estado.loja) { const r = estado.loja.h[Number(d.hon)]; r.on = el.checked; if (r.on && !r.f[0][0] && !r.f[0][1]) r.f[0] = ['08:00', '18:00']; renderizar(); return; }
    if (d.l || d.hf || d.ec || d.ef) return;   // campos de formulário: já atualizados no evento input
    if ('preco' in d) {   // preço editado na linha: atualiza só o campo, sem redesenhar a tela
      const item = buscarItem(d.id), centavos = Money.interpretar(el.value);
      if (Number.isNaN(centavos)) aviso('Preço inválido.');
      else { item.precoCentavos = centavos; salvar('menu'); aviso('Preço atualizado'); }
      el.value = Money.paraCampo(item.precoCentavos);
    } else if (d.p) {
      if (d.p === 'nome' && !estado.config.nome.trim()) estado.config.nome = 'Meu estabelecimento';
      salvar('config'); renderizar();
    } else if ('adic' in d && estado.detalhe) {
      const lista = estado.detalhe.adic, k = lista.indexOf(d.adic);
      if (el.checked && k < 0) lista.push(d.adic); else if (!el.checked && k >= 0) lista.splice(k, 1);
      renderizar();
    } else if (d.img) {
      const arquivo = el.files[0]; el.value = ''; if (!arquivo) return;
      try {
        const blob = await processarImagem(arquivo, d.img === 'capa' ? 1600 : d.img === 'logo' ? 512 : 1200);
        if (d.img === 'item') {
          const ed = estado.editor; if (ed.previewUrl) URL.revokeObjectURL(ed.previewUrl);
          ed.novaFoto = blob; ed.previewUrl = URL.createObjectURL(blob); ed.removerFoto = false;
        } else {
          const campo = d.img === 'capa' ? 'capaId' : 'logoId', antigo = estado.config[campo];
          estado.config[campo] = await M.imagens.salvar(blob); salvar('config');
          await removerImagem(antigo); await garantirImagens(); avisoSalvo('Imagem salva.');
        }
        renderizar();
      } catch (err) { aviso(err.message || 'Não foi possível usar esta imagem.'); }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (estado.editor || estado.detalhe)) { fecharModais(); renderizar(); }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.closest('#entrada')) { const b = document.querySelector('#entrada [data-primario]'); if (b) { e.preventDefault(); b.click(); } }
  });

  function atualizarTempos() {   // só os contadores, sem reconstruir a tela
    document.querySelectorAll('.age').forEach((el) => {
      const p = buscarPedido(el.dataset.id); if (!p) return;
      const min = Pedidos.minutosDesde(p);
      el.textContent = `${min} min`; el.className = `age ${Pedidos.nivelAtraso(min)}`;
    });
  }

  async function carregarEstado() {
    const { dados, invalidos } = await repositorio.carregar();
    estado.menu = dados.menu; estado.pedidos = dados.pedidos; estado.config = dados.config;
    await garantirImagens();
    return invalidos;
  }

  async function iniciar() {
    const invalidos = await carregarEstado();
    if (eco.token() && !eco.conectado()) { estado.visao = 'conexao'; eco.abrirTela(); }   // já entrou: falta ligar a loja
    renderizar();
    if (!repositorio.persistente) aviso('Armazenamento local bloqueado: os dados não serão mantidos ao recarregar.');
    else if (invalidos.length) aviso('Dados salvos inválidos foram restaurados ao padrão.');
    repositorio.aoMudarExternamente(async () => { await carregarEstado(); renderizar(); });
    setInterval(atualizarTempos, 30000);
    setInterval(eco.tic, 60000); eco.tic();
  }
  iniciar();
})(window.MESA);

</script>
