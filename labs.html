<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0a10">
<title>D'Castro Labs · Gestão</title>
<style>
:root{--bg:#0c0a10;--sf:#17121f;--sf2:#201829;--ln:#322745;--tx:#f3f0f8;--tx2:#a99fba;--cy:#37d8e6;--mg:#e04fb4;--go:#c9a54a;--ok:#4ade80;--wr:#fbbf24;--er:#f87171;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 480px at 88% -8%,#2b1654 0,transparent 62%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#140f1c,#0f0b15);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4b2a8a,#1d1130);border:1px solid var(--go);display:grid;place-items:center;color:var(--go);font-weight:800}
.brand small{display:block;color:var(--tx2);font-weight:400;font-size:12px}
.grp{margin:14px 8px 6px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx2)}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer;color:var(--tx2)}
.nav:hover{background:var(--sf2);color:var(--tx)}
.nav[aria-current=page]{background:linear-gradient(90deg,rgba(55,216,230,.16),transparent);color:var(--tx);box-shadow:inset 3px 0 var(--cy)}
.nav .ic{width:22px;text-align:center}
.dot{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--mg);color:var(--mg)}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--ln);background:rgba(12,10,16,.8);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.btn{min-height:42px;padding:6px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cy)}
.btn.p{background:var(--cy);border-color:var(--cy);color:#06222a;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top select{min-height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);padding:0 10px;max-width:100%}
#menu{display:none}
.wrap{padding:22px 20px 60px;max-width:1100px}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--tx2);margin:0 0 18px}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--tx2);vertical-align:middle}
.chip.real{border-color:var(--cy);color:var(--cy)}
.chip.demo{border-color:var(--mg);color:var(--mg)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.wr{border-color:var(--wr);color:var(--wr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px}
.card .l{color:var(--tx2);font-size:13px}
.card .v{font-size:24px;font-weight:700;margin:2px 0}
.card .s{color:var(--tx2);font-size:12px}
.panel{margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:15px;color:var(--tx)}
.li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}
.li .m{color:var(--tx2);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.empty{border:1px dashed var(--ln);border-radius:var(--r);padding:22px;text-align:center;color:var(--tx2)}
.note{border-left:3px solid var(--go);padding:8px 12px;background:rgba(201,165,74,.07);border-radius:0 10px 10px 0;color:var(--tx2);font-size:13px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.gate .panel{max-width:420px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--cy);padding:10px 16px;border-radius:12px;display:none;z-index:50}
.scrim{display:none}
@media(max-width:899px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none}
 .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
 #menu{display:inline-flex}
 .top{padding:10px 12px}.wrap{padding:16px 12px 60px}
 .grid{grid-template-columns:1fr 1fr}.card .v{font-size:20px}
}
.fld{display:block;margin-bottom:10px;font-size:13px;color:var(--tx2)}
.fld input,.fld select,.fld textarea,.acts input,.acts select{display:block;width:100%;margin-top:4px;min-height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:6px 10px;font:inherit}
.acts input,.acts select{width:auto;margin:0;flex:1 1 160px}
.err{color:var(--er);font-size:12px;display:block;min-height:0}
.li .acts{margin:0}.tg{font-size:12px;color:var(--tx2)}

.pro8{--line:var(--ln);--gold:var(--go)}
.mhp-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mhp-g button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:14px 8px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-weight:700;cursor:pointer;text-align:center}
.mhp-g button span{font-size:26px}
.mhp-g button:hover{border-color:var(--cy)}
.mhp-g button:last-child:nth-child(odd){grid-column:1/-1}
.v8row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:6px 0}
.v8card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.v8acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pro8 h4{margin:0 0 8px;font-size:14px}
.pro8 label{display:block;margin-bottom:10px;font-size:13px;color:var(--tx2)}
.pro8 label input,.pro8 label select,.pro8 label textarea{display:block;width:100%;margin-top:4px;min-height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:6px 10px;font:inherit}
.pro8 label.ck{display:flex;gap:8px;align-items:center}.pro8 label.ck input{width:auto;min-height:0;margin:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status"></div>
<script>
(function(){
var API='https://mihelp-api.mihelpmarketing.workers.dev';
var $=function(s){return document.querySelector(s)};
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function tk(){try{return localStorage.getItem('mh_tk')||sessionStorage.getItem('mh_tk')||''}catch(e){return ''}}
function expira(){if(S.exp)return;S.exp=1;gate('Sua sessão terminou. Entre de novo.')}
window.addEventListener('storage',function(e){if(e.key==='mh_tk'&&!tk())expira()});
function api(p){return fetch(API+p,{headers:{authorization:'Bearer '+tk()}}).then(function(r){if(r.status===401&&S.boot)expira();return r.json().catch(function(){return{}}).then(function(j){return{ok:r.ok,status:r.status,j:j}})}).catch(function(){return{ok:false,status:0,j:{erro:'sem conexão'}}})}
var R=function(v){return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var hhmm=function(m){m=Number(m)||0;return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2600)}

var S={cat:{tipos:[],cidades:{}},conv:[],transf:[],lojas:[],cur:null,res:null,resErr:'',rs:null,nome:'',view:'visao'};
var MODS=[
 ['Principal',[['visao','◧','Visão geral','real'],['empresa','🏢','Minha empresa','real'],['equipe','👥','Equipe','real'],['clientes','🤝','Clientes','real'],['servicos','🛠','Serviços e preços','real'],['orcamentos','🧾','Orçamentos e trabalhos','real'],['agenda','🗓','Agenda','real']]],
 ['Operação',[['financeiro','💰','Financeiro','real'],['estoque','📦','Estoque','real'],['relatorios','📊','Relatórios','demo'],['automacoes','⚡','Automações','demo']]],
 ['Workforce',[['meutrabalho','🧑‍💼','Meu Trabalho','demo'],['escalas','📅','Escalas e folgas','demo'],['ponto','⏱','Ponto digital','demo'],['avaliacoes','🔒','Avaliações privadas','demo'],['passaporte','🪪','Passaporte Profissional','demo']]],
 ['Sistema',[['studio','🎛','Personalização (Studio)','demo'],['config','⚙','Configurações','real']]]
];
var PROTO={
 clientes:['Clientes e fornecedores','Cadastro de clientes e fornecedores da empresa, com histórico de serviços e contatos.',['Ficha do cliente com histórico','Fornecedores e contatos','Vínculo com orçamentos e agenda'],'Precisa de coleção e rotas novas no Worker.'],
 relatorios:['Relatórios','Relatórios por período, a partir dos módulos ativos da empresa.',['Financeiro por mês','Estoque e giro','Equipe e agenda'],'Hoje só existe o resumo mensal em Financeiro.'],
 automacoes:['Automações','Regras simples, como avisar estoque baixo ou lembrar um orçamento pendente.',['Gatilho e ação','Avisos para a equipe'],'Sem especificação e sem backend. Não será construído antes disso.'],
 meutrabalho:['Meu Trabalho','Área do funcionário: jornada, escala, folgas, tarefas, comunicados e documentos, sem acessar o painel do patrão.',['Minha jornada e escala','Minhas folgas e solicitações','Minhas tarefas e comunicados','Documentos disponibilizados','Meu Passaporte Profissional'],'Precisa de vínculo funcionário-empresa com permissões próprias no Worker.'],
 escalas:['Escalas, folgas e ausências','Calendário semanal com turnos, folgas, pedidos e aprovações, com aviso de conflito de horário.',['Programado, em andamento, concluído','Pendente, aprovado, recusado','Necessita de revisão','Histórico de decisões'],'Precisa de coleções de turnos e solicitações no Worker. As regras de jornada variam por categoria profissional e precisam ser definidas.'],
 ponto:['Ponto digital','Registro de entrada, saída e intervalos, histórico e pedido de correção, para celular pessoal ou aparelho compartilhado.',['Entrada, saída e intervalos','Histórico e comprovantes','Pedido de correção'],'PROTÓTIPO. Não registra nada e não tem validade legal. O ponto eletrônico formal exige requisitos técnicos e legais próprios, e não há monitoramento contínuo.'],
 avaliacoes:['Avaliações profissionais privadas','Avaliações internas da empresa, com critérios por função, resposta e contestação do trabalhador e registro de alterações.',['Critérios por função, sem nota única','Resposta e contestação','Acesso restrito','Janela de 18 meses para o indicador atual; o registro não é apagado'],'São independentes das avaliações públicas do MiHelp, que não alimentam este módulo. Precisa de backend com permissões e política de retenção.'],
 passaporte:['Passaporte Profissional','Histórico profissional complementar do trabalhador: declarado por ele, confirmado por empresas, certificações e referências autorizadas.',['Declarado pelo profissional','Experiências confirmadas','Certificações e competências','Referências autorizadas'],'Não substitui a Carteira de Trabalho Digital nem documentos oficiais. Avaliações internas não entram automaticamente.'],
 studio:['D’Castro Studio','Cada empresa escolhe os módulos e personaliza atalhos, cartões e aparência do painel.',['Ativar e desativar módulos','Organizar cartões e atalhos'],'Só a estrutura de navegação existe por enquanto.']
};
function loja(){return S.lojas.find(function(l){return l.chave===S.cur})||null}

function shell(){var r=$('#root');r.textContent='';var app=h('div','app');
 var side=h('aside','side');side.id='side';
 var b=h('div','brand');b.append(h('div','logo','D'));var bt=h('div',null,'D’Castro Labs');bt.append(h('small',null,'Gestão empresarial'));b.append(bt);side.append(b);
 MODS.forEach(function(g){side.append(h('div','grp',g[0]));g[1].forEach(function(m){var n=h('button','nav');n.dataset.v=m[0];n.append(h('span','ic',m[1]),h('span',null,m[2]));if(m[3]==='demo')n.append(h('span','dot','protótipo'));n.onclick=function(){go(m[0]);$('#side').classList.remove('open');$('#scrim').classList.remove('on')};side.append(n)})});
 var main=h('div','main');var top=h('div','top');
 var mb=h('button','btn','☰');mb.id='menu';mb.setAttribute('aria-label','Abrir menu');mb.onclick=function(){$('#side').classList.add('open');$('#scrim').classList.add('on')};
 var sel=h('select');sel.id='ws';sel.setAttribute('aria-label','Empresa ativa');
 if(!S.lojas.length){sel.append(new Option('Nenhuma empresa','')) ;sel.disabled=true}
 S.lojas.forEach(function(l){sel.append(new Option(l.nome,l.chave))});sel.value=S.cur||'';
 sel.onchange=function(){S.cur=sel.value;try{sessionStorage.setItem('dl_loja',S.cur)}catch(e){}load().then(function(){go(S.view)})};
 var bell=h('button','btn','🔔');bell.setAttribute('aria-label','Notificações');bell.onclick=function(){toast('Sem notificações. Este recurso ainda não está conectado.')};
 var mi=h('a','btn','← MiHelp');mi.href='index.html';nova(mi);
 var u=h('span','chip',S.nome||'Conta'),so=h('button','btn','Sair');so.onclick=sair;
 top.append(mb,sel,h('span','sp'),bell,mi,u,so);
 var wrap=h('div','wrap');wrap.id='view';main.append(top,wrap);
 var sc=h('div','scrim');sc.id='scrim';sc.onclick=function(){$('#side').classList.remove('open');sc.classList.remove('on')};
 app.append(side,main);r.append(app,sc)}

function load(){var l=loja();S.res=null;S.resErr='';if(!l)return Promise.resolve();if(l.vinc){S.resErr='disponível só para o dono da empresa';return Promise.resolve()}
 return Promise.all([api('/gestao/resumo?chave='+encodeURIComponent(l.chave)),api('/reservas/minhas')]).then(function(a){
  if(a[0].ok&&a[0].j&&a[0].j.ok)S.res=a[0].j;else S.resErr=(a[0].j&&a[0].j.erro)||'indisponível';
  S.rs=a[1].ok&&a[1].j&&a[1].j.ok?a[1].j:null})}

function card(l,v,s){var c=h('div','card');c.append(h('div','l',l),h('div','v',v),h('div','s',s||''));return c}
function head(t,sub,kind){var d=h('div');var x=h('h1',null,t+' ');if(kind)x.append(h('span','chip '+kind,kind==='real'?'dados reais':'protótipo'));d.append(x,h('p','sub',sub||''));return d}
function empty(t,btn){var e=h('div','empty',t);if(btn)e.append(h('div','acts')).lastChild.append(btn);return e}
function nova(a){a.target='_blank';a.onclick=function(e){var w=null;try{w=window.open(a.href,'_blank')}catch(x){}if(w){e.preventDefault();try{w.opener=null}catch(x){}}};return a}
function lnk(t,href,p){var a=h('a','btn'+(p?' p':''),t);a.href=href;return nova(a)}
function semRes(v){var e=empty('Não foi possível mostrar estes dados: '+S.resErr+'.');v.append(e)}

var VIEWS={
 visao:function(v){var l=loja();v.append(head('Visão geral',l?l.nome:'','real'));if(!l)return noLoja(v);
  var g=h('div','grid');
  if(S.res){var r=S.res.resumo,low=(S.res.produtos||[]).filter(function(p){return Number(p.min)>0&&Number(p.qtd)<=Number(p.min)});
   g.append(card('Entradas do mês',R(r.entradas),S.res.mes),card('Saídas e gastos',R((r.saidas||0)+(r.gastos||0)),'inclui comissão: '+R(r.comissao)),card('Resultado estimado',R(r.resultado),'entradas menos custos lançados'),card('Entradas de hoje',R(r.hoje),S.res.hoje),card('Estoque baixo',String(low.length),low.length?'produtos no mínimo ou abaixo':'nenhum alerta'))}
  var eq=(l.equipe||[]).filter(function(x){return x.status==='aceito'}).length;
  g.append(card('Equipe aceita',String(eq),'além do dono'));
  if(S.rs)g.append(card('Horários marcados',String((S.rs.comoHelper||[]).length),'comigo como profissional'));
  v.append(g);if(!S.res)semRes(v);
  if(S.res){var p=h('div','panel');p.append(h('h2',null,'Entradas por forma de pagamento'));var f=S.res.resumo.porForma||{},tot=(f.dinheiro||0)+(f.pix||0)+(f.cartao||0);
   [['Dinheiro','dinheiro'],['Pix','pix'],['Cartão','cartao']].forEach(function(k){var row=h('div','li'),a=h('span',null,k[0]),b=h('span','m',R(f[k[1]]));row.append(a,b);p.append(row);var bar=h('div','bar'),i=h('i');i.style.width=(tot?Math.round(100*(f[k[1]]||0)/tot):0)+'%';bar.append(i);p.append(bar)});v.append(p)}
  var at=h('div','panel');at.append(h('h2',null,'Atalhos'));var ac=h('div','acts');[['financeiro','Financeiro'],['estoque','Estoque'],['equipe','Equipe'],['agenda','Agenda']].forEach(function(k){var b=h('button','btn',k[1]);b.onclick=function(){go(k[0])};ac.append(b)});at.append(ac);v.append(at)},
 empresa:function(v){var l=loja();v.append(head('Minha empresa',l?l.nome:'','real'));if(!l)return noLoja(v);
  var p=h('div','panel');[['Nome',l.nome],['Tipo',l.tipo],['Cidade',l.cidade],['Endereço',l.endereco||'—'],['Contato',l.contato||'—'],['Modo',l.modo==='agenda'?'Agenda com horários':'Conversa e contato'],['Favoritos',String(l.favs||0)],['Identificação do espaço',l.chave]].forEach(function(k){var r=h('div','li');r.append(h('span','m',k[0]),h('span',null,k[1]));p.append(r)});
  var ac=h('div','acts');ac.append(lnk('Ver perfil público no MiHelp','index.html?loja='+encodeURIComponent(l.chave),1),lnk('Editar no MiHelp','index.html'));p.append(ac);
  p.append(h('div','note','O perfil público (foto, WhatsApp, localização e horário) é editado no MiHelp, a vitrine. Caixa, estoque, serviços e equipe ficam aqui no Labs.'));v.append(p)},
 agenda:function(v){var l=loja();v.append(head('Agenda',l?l.nome:'','real'));if(!l)return noLoja(v);
  var p=h('div','panel');p.append(h('h2',null,'Quem marcou comigo'));var a=S.rs?S.rs.comoHelper||[]:[];if(!S.rs)p.append(empty('Não foi possível carregar a agenda agora.'));else if(!a.length)p.append(empty('Nenhum horário marcado.'));
  a.forEach(function(x){var r=h('div','li');r.append(h('span',null,x.dia.split('-').reverse().join('/')+' · '+hhmm(x.ini)+' · '+x.servico),h('span','m',x.clienteNome+' · '+x.estNome));p.append(r)});v.append(p)},
 config:function(v){v.append(head('Configurações','Sessão e espaço de trabalho.','real'));var p=h('div','panel');
  [['Conta',S.nome||'—'],['Empresa ativa',(loja()||{}).nome||'—'],['Empresas na conta',String(S.lojas.length)]].forEach(function(k){var r=h('div','li');r.append(h('span','m',k[0]),h('span',null,k[1]));p.append(r)});
  p.append(h('div','note','Permissões são verificadas no servidor (Worker). Esta tela só guarda no navegador a empresa selecionada, nada sensível.'),lnk('Voltar ao MiHelp','index.html',1));v.append(p)}
};
function protoView(id,v){var d=PROTO[id];v.append(head(d[0],d[1],'demo'));var p=h('div','panel');p.append(h('h2',null,'O que este módulo terá'));d[2].forEach(function(t){var r=h('div','li');r.append(h('span',null,t));p.append(r)});
 p.append(h('div','note',d[3]));
 if(id==='ponto'){var a=h('div','acts');['Registrar entrada','Registrar saída'].forEach(function(t){var b=h('button','btn',t);b.disabled=true;a.append(b)});p.append(a)}
 v.append(p);v.append(empty('Nenhum dado. Este módulo ainda não está conectado a um servidor.'))}

function go(id){S.view=id;try{history.replaceState(null,'','#'+id)}catch(e){}
 document.querySelectorAll('.nav').forEach(function(n){if(n.dataset.v===id)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});
 var v=$('#view');v.textContent='';(VIEWS[id]||function(x){protoView(id,x)})(v);window.scrollTo(0,0)}

function boot(){
 if(!tk())return gate();
 var r=$('#root');r.append(h('div','gate','Carregando…'));
 Promise.all([api('/perfil/meu'),api('/conta/eu')]).then(function(a){
