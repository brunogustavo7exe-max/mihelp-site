<title>Domin · Gestão empresarial</title>
<style>
:root{--bg:#05070d;--sf:#0b1220;--sf2:#101a2e;--ln:#1b2a47;--tx:#eaf1fb;--tx2:#8ea0bd;--cy:#2ea8ff;--mg:#7f8cff;--go:#c3ccd9;--ok:#4ade80;--wr:#fbbf24;--er:#f87171;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 480px at 88% -8%,#0b2a52 0,transparent 62%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#070b14,#04060c);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#12315f,#070b14);border:1px solid var(--go);display:grid;place-items:center;color:var(--go);font-weight:800}
.brand small{display:block;color:var(--tx2);font-weight:400;font-size:12px}
.grp{margin:14px 8px 6px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx2)}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer;color:var(--tx2)}
.nav:hover{background:var(--sf2);color:var(--tx)}
.nav[aria-current=page]{background:linear-gradient(90deg,rgba(46,168,255,.16),transparent);color:var(--tx);box-shadow:inset 3px 0 var(--cy)}
.nav .ic{width:22px;text-align:center}
.dot{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--mg);color:var(--mg)}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--ln);background:rgba(5,7,13,.8);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.btn{min-height:42px;padding:6px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cy)}
.btn.p{background:var(--cy);border-color:var(--cy);color:#031526;font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.top select{min-height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);padding:0 10px;max-width:100%}
#menu{display:none}
.wrap{padding:22px 20px 60px;max-width:1100px}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--tx2);margin:0 0 18px}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--tx2);vertical-align:middle}
.chip.real{border-color:var(--cy);color:var(--cy)}
.chip.demo{border-color:var(--mg);color:var(--mg)}
.chip.ok{border-color:var(--ok);color:var(--ok)}.chip.wr{border-color:var(--wr);color:var(--wr)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px}
.card .l{color:var(--tx2);font-size:13px}
.card .v{font-size:24px;font-weight:700;margin:2px 0}
.card .s{color:var(--tx2);font-size:12px}
.panel{margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:15px;color:var(--tx)}
.li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}
.li .m{color:var(--tx2);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.empty{border:1px dashed var(--ln);border-radius:var(--r);padding:22px;text-align:center;color:var(--tx2)}
.note{border-left:3px solid var(--go);padding:8px 12px;background:rgba(195,204,217,.07);border-radius:0 10px 10px 0;color:var(--tx2);font-size:13px;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.gate .panel{max-width:420px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--cy);padding:10px 16px;border-radius:12px;display:none;z-index:50}
.scrim{display:none}
@media(max-width:899px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:30;transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none}
 .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
 #menu{display:inline-flex}
 .top{padding:10px 12px}.wrap{padding:16px 12px 60px}
 .grid{grid-template-columns:1fr 1fr}.card .v{font-size:20px}
}
.fld{display:block;margin-bottom:10px;font-size:13px;color:var(--tx2)}
.fld input,.fld select,.fld textarea,.acts input,.acts select{display:block;width:100%;margin-top:4px;min-height:42px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);padding:6px 10px;font:inherit}
.acts input,.acts select{width:auto;margin:0;flex:1 1 160px}
.err{color:var(--er);font-size:12px;display:block;min-height:0}
.li .acts{margin:0}.tg{font-size:12px;color:var(--tx2)}

.pro8{--line:var(--ln);--gold:var(--go)}
.mhp-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.mhp-g button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:14px 8px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-weight:700;cursor:pointer;text-align:center}

<style id="emp-css">
.efg{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.efg .pvcol{position:sticky;top:76px}
@media(max-width:980px){.efg{grid-template-columns:1fr}.efg .pvcol{position:static;order:-1}}
.pvw{background:var(--sf);border:1px solid var(--ln);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.pvtag{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--ln);background:rgba(46,168,255,.06)}
.pvtag b{color:var(--cy)}
.pvband{height:86px;background:linear-gradient(135deg,#12315f,#0b1220 72%)}
.pvhead{display:flex;gap:12px;align-items:flex-end;margin:-30px 14px 8px;position:relative}
.pvav{flex:none;width:66px;height:66px;border-radius:18px;border:3px solid var(--sf);overflow:hidden;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:#1b2a47}
.pvav img{width:100%;height:100%;object-fit:cover;display:block}
.pvhead h3{margin:0;font-size:18px;line-height:1.2;word-break:break-word}.pvhead p{margin:2px 0 0;color:var(--tx2);font-size:13px}
.pvb{padding:0 14px 14px}
.pvb p{margin:6px 0}
.pvst{font-weight:700;font-size:13px}.pvst.on{color:var(--ok)}.pvst.off{color:var(--er)}.pvst.nd{color:var(--tx2)}
.pvb details{margin:6px 0;font-size:13px;color:var(--tx2)}.pvb summary{cursor:pointer;color:var(--tx)}
.pvph{color:var(--tx2);opacity:.7}
.pvlk{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pvlk span{border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-size:13px;background:var(--sf2)}
.pvtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.pvtabs button{border:1px solid var(--ln);background:var(--sf2);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--tx)}
.pvtabs button[aria-selected=true]{background:var(--cy);border-color:var(--cy);color:#031526}
.pvpane{border:1px dashed var(--ln);border-radius:14px;padding:12px;font-size:13px;color:var(--tx2);min-height:64px}
.pvpane .it{display:flex;justify-content:space-between;gap:8px;padding:5px 0;color:var(--tx)}
.lgrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
</style>
</head>

     r.append(h('span','fs-n',String(ix+1)),h('span','fs-nm',i.nome),h('span','fs-q',i.qtd+' × '+R(i.venda)),h('b','fs-sub',R(i.qtd*i.venda)),a);lista.append(r)})}
   function pTot(){tot.textContent='';var F=falta(),T=F.T;
    tot.append(h('div','fs-lbl','Subtotal'),h('div','fs-val',R(T.bruto)));if(T.desc)tot.append(h('div','fs-lbl','Desconto'),h('div','fs-val','−'+R(T.desc)));
    tot.append(h('div','fs-lbl','TOTAL'),h('div','fs-total',R(T.total)));
    if(E().perms.indexOf('desconto')>-1&&PD.cart.length){var db=btn(st.descOpen?'Fechar desconto':'Desconto',function(){st.descOpen=!st.descOpen;pTot()});tot.append(db);
     if(st.descOpen){var ds=fl('Desconto (R$)','text',{inputMode:'decimal',value:PD.desc}),mt=fl('Motivo do desconto','text',{value:PD.mot,maxLength:80});ds.i.onchange=function(){PD.desc=ds.i.value;limpaPag();pinta()};mt.i.onchange=function(){PD.mot=mt.i.value};tot.append(ds.l,mt.l)}}
    PD.pag.forEach(function(p,ix){var r=h('div','fs-pg');r.append(h('span',null,FP[p.forma]+': '+R(p.valor)+(p.forma==='dinheiro'&&p.rec>p.valor?' (recebido '+R(p.rec)+', troco '+R(p.rec-p.valor)+')':'')));var x=btn('✕',function(){PD.pag.splice(ix,1);st.forma=null;pinta()});x.setAttribute('aria-label','Remover pagamento');r.append(x);tot.append(r)});
    if(PD.cart.length)tot.append(h('div','fs-falta'+(F.falta>0?'':' ok'),F.falta>0?'Falta '+R(F.falta):'Pago — pode finalizar'))}
   function valeOk(){return E().membros.filter(function(m){return E().vales[m.quem]&&E().vales[m.quem].ativo})}
   function abrePag(f){if(st.fim)return;if(!PD.cart.length){aviso('Adicione produtos antes.','err');return}if(falta().falta<=0){aviso('O total já está pago. Finalize a venda (F9).');return}
    if(f==='vale'&&!valeOk().length){aviso('Nenhum funcionário com vale autorizado.','err');return}st.forma=f;aviso('');pPay()}
   function pPay(){pay.textContent='';
    if(st.fim){var d=h('div','fs-done');d.append(h('div','fs-lbl','Venda #'+(st.fim.n||'')+' concluída'),h('div','fs-val',R(st.fim.total)));if(st.fim.troco>0)d.append(h('div','fs-lbl','TROCO'),h('div','troco',R(st.fim.troco)));var nv=btn('Nova venda (Enter)',function(){if(Date.now()-st.fim.t<700)return;st.fim=null;pinta();bq.focus()},'p');nv.className+=' fs-fin';d.append(nv);pay.append(d);nv.focus();return}
    if(!PD.cart.length){pay.append(h('p','fs-empty','Passe os produtos para começar a venda.'));return}
    var F=falta();
    if(st.forma){var f=st.forma,box=h('div','fs-form');box.append(h('h2',null,FP[f]));
     var vf=fl('Valor (R$)','text',{inputMode:'decimal',value:String(F.falta).replace('.',',')}),rc=fl('Dinheiro recebido (R$)','text',{inputMode:'decimal',value:String(F.falta).replace('.',',')}),vs=sel([['','Escolha o funcionário']].concat(valeOk().map(function(m){return[m.quem,m.nome+' (disp. '+R(E().vales[m.quem].limite-E().vales[m.quem].saldo)+')']})),PD.vale),tr=h('div','fs-troco');
     box.append(vf.l);if(f==='dinheiro'){box.append(rc.l,tr);var ct=function(){var v=num8(vf.i.value),r=num8(rc.i.value);tr.textContent=r>v?'Troco: '+R(r-v):''};vf.i.oninput=ct;rc.i.oninput=ct;ct()}
     if(f==='vale')box.append(lab('Funcionário',vs));
     if(f==='pix'||f==='debito'||f==='credito')box.append(h('p','fs-aviso','Registro manual: o sistema NÃO confirma este pagamento com banco ou maquininha. Só confirme depois de conferir no seu terminal.'));
     var ok=btn('Confirmar (Enter)',function(){var val=num8(vf.i.value),rec=f==='dinheiro'&&rc.i.value?num8(rc.i.value):val,G=falta();
      if(!(val>0)||val>G.falta+0.001){aviso('Valor inválido (falta '+R(G.falta)+').','err');return}
      if(f==='dinheiro'&&rec<val){aviso('Dinheiro recebido menor que o valor.','err');return}
      if(f==='vale'){if(!vs.value){aviso('Escolha o funcionário.','err');return}PD.vale=vs.value}
      PD.pag.push({forma:f,valor:val,rec:rec});st.forma=null;aviso('');pinta();var fb=pay.querySelector('.fs-fin');if(fb)fb.focus()},'p'),ca=btn('Cancelar (Esc)',function(){st.forma=null;pPay();bq.focus()});
     var ac=h('div','acts');ac.append(ok,ca);box.append(ac);box.onkeydown=function(e){if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();ok.click()}};pay.append(box);
     (f==='dinheiro'?rc.i:f==='vale'?vs:vf.i).focus();return}
    var g=h('div','fs-forms');[['dinheiro','F4 Dinheiro'],['pix','F5 Pix'],['debito','F6 Débito'],['credito','F7 Crédito']].concat(valeOk().length?[['vale','F8 Vale']]:[]).forEach(function(x){g.append(btn(x[1],function(){abrePag(x[0])}))});pay.append(g);
    var fin=btn('Finalizar venda (F9)',finaliza,'p');fin.className+=' fs-fin';fin.disabled=F.falta!==0||st.busy;pay.append(fin)}
   function finaliza(){if(st.busy||PD.fin)return;var F=falta();
    if(!PD.cart.length){aviso('Adicione produtos.','err');return}if(F.falta!==0){aviso('Pagamento não fecha o total (falta '+R(F.falta)+').','err');return}
    st.busy=true;PD.fin=true;aviso('Enviando venda…');pPay();var T=F.T;
    chama8('/pdv/venda',{chave:l.chave,rid:PD.rid,itens:PD.cart.map(function(i){return{id:i.id,qtd:i.qtd}}),desconto:T.desc,motivo:PD.mot,pag:PD.pag,vale:PD.vale}).then(function(r){
     st.busy=false;PD.fin=false;
     if(r.ok&&r.j&&r.j.ok){var v=r.j.venda||{};st.fim={n:v.n,troco:v.troco||0,total:T.total,t:Date.now()};PD.cart=[];PD.pag=[];PD.desc='';PD.mot='';PD.vale='';PD.rid=uid8();st.ult=null;st.sug=[];st.forma=null;aviso('');pinta();return carrega()}
     aviso(r.status===0?'Sem resposta do servidor. Aperte Finalizar de novo: a venda não duplica.':((r.j&&r.j.erro)||'Não foi possível concluir.'),'err');pPay();if(r.status===409)carrega()})}
   function pinta(){pSug();pUlt();pLista();pTot();pPay()}
   function tecla(e){if(!document.body.contains(ov))return;
    if(st.fim){if(['Shift','Control','Alt','Meta','Tab'].indexOf(e.key)>-1)return;var rec=Date.now()-st.fim.t<700;if(/^F\d+$/.test(e.key)||((e.key==='Enter'||e.key==='Escape')&&rec)){e.preventDefault();return}st.fim=null;pinta();bq.focus();if(e.key==='Enter'||e.key==='Escape')e.preventDefault();return}
    var F={F4:'dinheiro',F5:'pix',F6:'debito',F7:'credito',F8:'vale'};
    if(e.key==='F2'){e.preventDefault();bq.focus();bq.select()}
    else if(e.key==='F3'){e.preventDefault();if(PD.cart.length){PD.cart.pop();limpaPag();st.ult=null;pinta()}}
    else if(F[e.key]){e.preventDefault();abrePag(F[e.key])}
    else if(e.key==='F9'){e.preventDefault();if(!st.forma)finaliza()}
    else if(e.key==='Escape'){e.preventDefault();if(st.forma){st.forma=null;pPay();bq.focus()}else{bq.value='';st.sug=[];pSug();bq.focus()}}}
   document.addEventListener('keydown',tecla,true);
   function fecha(){clearInterval(iv);document.removeEventListener('keydown',tecla,true);try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}
    ov.remove();document.body.style.overflow='';PD.fs=false;if(PD.E)desenha()}
   pinta();bq.focus()}
  carrega()};

boot();
})();
