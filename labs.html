<title>D'Castro Labs · Gestão</title>
<style>
:root{--bg:#05070d;--sf:#0b1220;--sf2:#101a2e;--ln:#1b2a47;--tx:#eaf1fb;--tx2:#8ea0bd;--cy:#2ea8ff;--mg:#7f8cff;--go:#c3ccd9;--ok:#4ade80;--wr:#fbbf24;--er:#f87171;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 480px at 88% -8%,#0b2a52 0,transparent 62%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#070b14,#04060c);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#12315f,#070b14);border:1px solid var(--go);display:grid;place-items:center;color:var(--go);font-weight:800}
.brand small{display:block;color:var(--tx2);font-weight:400;font-size:12px}

.kpi .kgo svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi.click:hover .kgo{opacity:1;color:var(--cy);transform:translateX(2px)}

.ctx{display:inline-flex;gap:4px;padding:4px;margin:0 0 16px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);max-width:100%}
.ctx button{border:0;background:transparent;color:var(--tx2);min-height:40px;padding:0 18px;border-radius:99px;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button:hover:not(:disabled){color:var(--tx)}
.ctx button[aria-selected=true]{background:linear-gradient(135deg,#2ea8ff,#1c6fe8);color:#fff;box-shadow:0 0 14px rgba(46,168,255,.35)}
.ctx button:disabled{opacity:.4;cursor:not-allowed}
</style>
