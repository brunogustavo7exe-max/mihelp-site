<style>
:root{--bg:#05070d;--sf:#0b1220;--sf2:#101a2e;--ln:#1b2a47;--tx:#eaf1fb;--tx2:#8ea0bd;--cy:#2ea8ff;--mg:#7f8cff;--ok:#4ade80;--wr:#fbbf24;--er:#f87171}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:radial-gradient(900px 480px at 88% -8%,#0b2a52,transparent 62%),var(--bg) fixed;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);background:rgba(5,7,13,.88);backdrop-filter:blur(8px)}
.top .w{width:30px}.top .n{width:62px}.sp{flex:1}
.seg{display:flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--tx2);padding:8px 14px;min-height:40px;cursor:pointer;font-weight:700}
.seg button[aria-pressed=true]{background:var(--cy);color:#031526}
.tabs{display:flex;gap:8px;padding:12px 14px 0;overflow-x:auto;max-width:980px;margin:auto}
.pill{flex:none;min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);color:var(--tx2);font-weight:600;cursor:pointer;white-space:nowrap}
.pill[aria-pressed=true]{background:rgba(46,140,255,.2);border-color:var(--cy);color:var(--tx)}
.wrap{max-width:980px;margin:auto;padding:14px 14px 80px}
.card,.panel{background:linear-gradient(160deg,var(--sf),#080d19);border:1px solid var(--ln);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 16px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);cursor:pointer;font-weight:600;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--cy)}.btn.p{background:var(--cy);border-color:var(--cy);color:#031526;font-weight:800}.btn.sm{min-height:38px;padding:4px 12px;font-size:14px}.btn.dg{color:var(--er)}.btn.big{width:100%;min-height:54px;font-size:17px}.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--tx2);white-space:nowrap}
.chip.cy{border-color:var(--cy);color:var(--cy)}.chip.ok{border-color:rgba(74,222,128,.6);color:var(--ok)}.chip.wr{border-color:rgba(251,191,36,.6);color:var(--wr)}.chip.er{border-color:rgba(248,113,113,.6);color:var(--er)}.chip.mg{border-color:rgba(127,140,255,.6);color:var(--mg)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.ph h2{font-size:16px}.mut,.m{color:var(--tx2);font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.kv{font-size:24px;font-weight:800}
.li{display:flex;gap:8px 12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--ln)}.li:first-child{border-top:0}
.empty{border:1px dashed var(--ln);border-radius:16px;padding:22px;text-align:center;color:var(--tx2);margin-bottom:12px}
.note{border-left:3px solid #c3ccd9;padding:9px 13px;background:rgba(195,204,217,.07);border-radius:0 12px 12px 0;color:var(--tx2);font-size:13.5px;margin:10px 0}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 4px}.steps i{height:6px;border-radius:9px;background:var(--ln)}.steps i.on{background:var(--cy)}
.stl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:10px;color:var(--tx2);text-align:center}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:20px;padding:18px;width:min(520px,94vw);max-height:92vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.65)}dialog h2{font-size:18px;margin-bottom:10px}
.fld{display:block;margin-bottom:10px;font-size:13px;color:var(--tx2);font-weight:600}.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;min-height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);padding:8px 12px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}.err{color:var(--er);font-size:13px;display:block;min-height:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.sch{min-height:40px;padding:6px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);width:100%;max-width:300px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--cy);padding:10px 16px;border-radius:12px;display:none;z-index:60;max-width:92vw}
@media(max-width:560px){.row2{grid-template-columns:1fr}.seg button{padding:8px 10px}}
.al{border-left:4px solid var(--cy)}.al.n2{border-left-color:var(--wr)}.al.n3{border-left-color:var(--er);background:linear-gradient(160deg,#2a0f14,#12060a)}
.ck{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ck .btn{min-height:56px;font-size:16px}
.btn.sos{background:var(--er);border-color:var(--er);color:#1a0505;font-weight:800}
.pin{font:800 34px/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;margin-top:4px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--ln)}
.tbw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:8px 6px;border-top:1px solid var(--ln);text-align:left;white-space:nowrap}.tb th{color:var(--tx2);font-weight:600;border-top:0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 14px}
.ck2{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:14px;grid-column:1/-1}.ck2 input{width:22px;height:22px}

/* ===== RIVO · identidade logística (central de despacho) ===== */
:root{--bg:#0c0e11;--sf:#14171c;--sf2:#1b1f26;--ln:#2a2f38;--tx:#f3f5f8;--tx2:#9aa3b0;--cy:#ffb800;--mg:#4aa8ff;--ok:#3ddc84;--wr:#ffb800;--er:#ff6159;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body{background:
 linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/44px 44px,
 linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/44px 44px,
 radial-gradient(900px 420px at 100% -10%,rgba(255,184,0,.10),transparent 60%),var(--bg) fixed;letter-spacing:.005em}
:focus-visible{outline:2px solid var(--cy)}
.top{padding:8px 14px;gap:12px;background:rgba(12,14,17,.92);border-bottom:0;position:sticky}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(-45deg,var(--cy) 0 10px,#111 10px 20px);opacity:.9}
.top .w{width:46px}.top .n{width:92px;filter:drop-shadow(0 0 12px rgba(74,168,255,.25))}
.who{display:flex;align-items:center;gap:8px}.who .u{font-size:13px;color:var(--tx2);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who .u b{color:var(--tx)}
.seg{border-radius:8px;background:var(--sf);border-color:var(--ln)}
.seg button{border-radius:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:8px 13px}
.seg button[aria-pressed=true]{background:var(--cy);color:#14110a}
.tabs{gap:0;padding:14px 14px 0;border-bottom:1px solid var(--ln);max-width:none;margin:0}
.pill{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;min-height:44px;padding:6px 14px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--tx2)}
.pill:hover{color:var(--tx)}.pill[aria-pressed=true]{background:transparent;border-bottom-color:var(--cy);color:var(--cy)}
.wrap{max-width:1040px;padding-top:18px}
.card,.panel{background:var(--sf);border:1px solid var(--ln);border-radius:10px;position:relative}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ln)}
.ph h2,.panel h2,h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.btn{border-radius:8px;background:var(--sf2);font-weight:700}.btn:hover{border-color:var(--cy)}
.btn.p{background:var(--cy);border-color:var(--cy);color:#14110a;font-weight:800;letter-spacing:.02em}
.btn.p:hover{filter:brightness(1.08)}
.chip{border-radius:5px;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px;padding:3px 8px}
.kpis{gap:0;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf);margin-bottom:14px}
.kpis .card{border:0;border-radius:0;border-right:1px solid var(--ln);margin:0!important;background:transparent;padding:12px 14px}
.kpis .card::before{display:none}
.kpis .kb{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}.kpis .kb:hover{background:rgba(255,184,0,.07)}.kpis .kb:focus-visible{outline:2px solid var(--cy);outline-offset:-2px}
.kpis .card .m{font-size:11px;text-transform:uppercase;letter-spacing:.09em}
.kv{font:800 34px/1.1 var(--mono);color:var(--tx)}
.pin{font-family:var(--mono)}
.steps{gap:3px}.steps i{height:8px;border-radius:2px;background:var(--ln)}.steps i.on{background:var(--cy);box-shadow:0 0 10px rgba(255,184,0,.35)}
.stl{font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.note{border-left-color:var(--cy);background:rgba(255,184,0,.06);border-radius:0 8px 8px 0}
.empty{border-radius:10px}
dialog{border-radius:14px;background:var(--sf);border-color:var(--ln)}
dialog h2{font-size:16px}
.fld input,.fld select,.fld textarea{background:var(--bg);border-radius:8px}
#toast{border-color:var(--cy);border-radius:8px}
.li b{font-family:var(--mono);font-weight:700}
/* faixa de despacho (visão geral) */
.hero{position:relative;overflow:hidden;border:1px solid var(--ln);border-radius:12px;background:linear-gradient(120deg,#171b21 0%,#10130f 100%);padding:18px 18px 8px;margin-bottom:14px}
.hero .ey{font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cy)}
.hero h1{font-size:26px;line-height:1.15;margin:4px 0 6px;font-weight:800;letter-spacing:-.01em}
.hero p{color:var(--tx2);max-width:46ch;margin-bottom:12px}
.hero .acts{margin-bottom:6px}
.hero svg{display:block;width:100%;height:92px;margin-top:6px}
.hero .rt{stroke:var(--cy);vector-effect:non-scaling-stroke;stroke-width:3;fill:none;stroke-dasharray:10 9;animation:rt 1.2s linear infinite;opacity:.9}
.hero .rb{stroke:#2f3540;vector-effect:non-scaling-stroke;stroke-width:16;fill:none;stroke-linecap:round}
@keyframes rt{to{stroke-dashoffset:-19}}
@media(prefers-reduced-motion:reduce){.hero .rt{animation:none}}

/* menu lateral */
body{display:grid;grid-template-columns:244px minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;min-height:100vh}
.top{grid-column:1/-1}#entrada{grid-column:1/-1}
.side{grid-column:1;grid-row:2;position:sticky;top:var(--hh,60px);height:calc(100vh - var(--hh,60px));overflow:auto;border-right:1px solid var(--ln);background:rgba(20,23,28,.55);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.wrap{grid-column:2;grid-row:2;width:100%;margin:0 auto;max-width:1060px}
body.semlado{grid-template-columns:minmax(0,1fr)}body.semlado .side{display:none}body.semlado .wrap{grid-column:1}
.sl{font:700 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);opacity:.75;padding:14px 10px 6px}.sl:first-child{padding-top:2px}
.nv{display:flex;align-items:center;gap:11px;width:100%;min-height:42px;padding:8px 10px;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;background:transparent;color:var(--tx2);font-weight:600;font-size:14.5px;text-align:left;cursor:pointer}
.nv:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.nv[aria-current=page]{background:rgba(255,184,0,.12);border-left-color:var(--cy);color:var(--tx)}.nv[aria-current=page] .ic{color:var(--cy)}
.nv .ic{display:grid;place-items:center;flex:none}.nv .tx{flex:1}
.nv .cnt{background:var(--er);color:#fff;border-radius:99px;font:800 11px var(--mono);padding:2px 7px}
.sfoot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--ln)}
.hbg{display:none;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;width:42px;height:42px;place-items:center;cursor:pointer}
#bk{display:none}
@media(max-width:900px){
 body{grid-template-columns:minmax(0,1fr)}.wrap{grid-column:1}
 .hbg{display:grid}body.semlado .hbg{display:none}
 .side{position:fixed;grid-column:auto;top:0;left:0;bottom:0;height:100vh;width:272px;z-index:30;transform:translateX(-102%);transition:transform .2s;background:var(--sf);box-shadow:0 0 40px rgba(0,0,0,.6)}
 body.menuopen .side{transform:none}body.menuopen #bk{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
body.deslogado .side,body.deslogado .hbg{display:none}
/* tutorial */
.tut h2{font-size:18px;margin-bottom:6px}.tut>.m{margin-bottom:12px}
.tl{display:grid;gap:0}.st{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px dashed var(--ln);position:relative}
.st .nb{flex:none;width:30px;height:30px;border-radius:50%;background:var(--cy);color:#14110a;font:800 14px/30px var(--mono);text-align:center}
.st b{display:block;margin-bottom:2px}
/* entrada (login) */
#entrada{display:none}
body.deslogado .top,body.deslogado .tabs,body.deslogado .wrap{display:none}
body.deslogado #entrada{display:grid;min-height:100vh;place-items:center;padding:24px 14px}
.lg{width:100%;max-width:420px;position:relative;overflow:hidden;padding:30px 24px 20px;border:1px solid var(--ln);border-radius:14px;background:linear-gradient(180deg,var(--sf),#0f1216);box-shadow:0 24px 70px rgba(0,0,0,.6);display:grid;gap:10px}
.lg::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(-45deg,var(--cy) 0 12px,#111 12px 24px)}
.lg .lw{display:block;width:150px;max-width:55%;margin:2px auto -6px;filter:drop-shadow(0 0 18px rgba(74,168,255,.3))}
.lg .ln{display:block;width:160px;max-width:55%;margin:0 auto}
.lg .tg{text-align:center;color:var(--tx2);font:700 11px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.lg .sub{text-align:center;color:var(--tx2);font-size:14px}
.lg .btn{width:100%;min-height:48px;font-size:15px}
.lg .ckl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--tx2);cursor:pointer}.lg .ckl input{width:18px;height:18px;accent-color:var(--cy)}
.lg .esq{font-size:12.5px;color:var(--tx2);text-align:center}.lg .esq a{color:var(--cy)}
.lg .err{text-align:center}
@media(max-width:560px){.top{flex-wrap:wrap}.top .sp{display:none}.who{margin-left:auto}.seg{order:5;width:100%}.seg button{flex:1;padding:8px 4px}.kpis .card:last-child{grid-column:1/-1}.top .n{width:76px}.who .u{display:none}.kpis .card{border-right:0;border-bottom:1px solid var(--ln)}.hero h1{font-size:22px}}
/* ===== RIVO · rotas (modo Spoke) ===== */
.rmap{position:relative;z-index:0;isolation:isolate;width:100%;border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--sf)}
.rmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.95) saturate(.6)}
.rmap.pick{cursor:crosshair;outline:2px solid var(--cy)}
.rmap .leaflet-container{background:var(--sf)}
.pn{display:inline-block;flex:none;width:30px;height:30px;border-radius:50%;background:var(--sf2);border:2px solid var(--cy);color:var(--tx);font:800 13px/26px var(--mono);text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pn.nx{background:var(--cy);color:#14110a}
.pn.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
.pn.er{background:var(--er);border-color:var(--er);color:#1a0505}
.pn.st{background:#fff;color:#111;border-color:#111}
.pn.me{background:var(--mg);border-color:#fff;width:16px;height:16px}
.rl{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}
.rl:first-child{border-top:0}
.rl .bd{flex:1;min-width:0}
.rl .bd b{display:block;overflow-wrap:anywhere}
.rl .ac2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rl.fe{opacity:.55}
.nxt{border-left:4px solid var(--cy)}
.nxt .end{font-size:19px;font-weight:800;line-height:1.25;margin:6px 0;overflow-wrap:anywhere}
.nxt .dois{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bar{height:8px;border-radius:2px;background:var(--ln);overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--cy)}
.bar i.v{background:var(--ok)}

::-webkit-scrollbar-track{background:#0c0e11;border-left:1px solid #1d222a}
::-webkit-scrollbar-thumb{background:#ffe600;border-radius:8px;border:2px solid #0c0e11;box-shadow:0 0 8px #ffe600}
::-webkit-scrollbar-thumb:hover{background:#fff35c}
::-webkit-scrollbar-corner{background:#0c0e11}
.leaflet-container{position:relative;isolation:isolate}
